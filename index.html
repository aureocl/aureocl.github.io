<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Áureo</title>
<meta name="description" content="Escudos de fútbol, camisetas con nombre y figuras en mini bloques para armar y colgar. Tu equipo, armado por ti.">
<meta property="og:title" content="Catálogo Áureo">
<meta property="og:description" content="Escudos, camisetas y figuras en mini bloques. Tu equipo, armado por ti.">
<link rel="icon" href="isotipo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="aviso-proto" id="avisoProto" style="display:none">Prueba · fotos de clientes y video son espacios por llenar</div>
<div class="urgencia" id="urgencia" style="display:none"></div>
<header id="cab"><img src="logo.svg" alt="Áureo"><p class="frase">Lo que amas se arma</p></header>
<div class="top" id="top">
  <button class="volver" id="volver" aria-label="Volver">‹</button>
  <input class="buscar" id="buscar" type="search" placeholder="Busca tu equipo o personaje…" autocomplete="off">
  <div class="titulo" id="titulo"></div>
</div>
<main id="vista"><p class="vacio">Cargando catálogo…</p></main>
<button class="carro-flot" id="carroFlot"></button>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastVer">Ver pedido</button></div>

<script src="js/config.js"></script>
<script src="js/medicion.js"></script>
<script src="js/base.js"></script>
<script src="js/vitrina.js"></script>
<script src="js/pedido.js"></script>

<!DOCTYPE html>
<!-- NO EDITAR AQUÍ: se genera desde el repo Aureo, clientes-pedidos/pedidos-web/Panel.html con publicar_bandeja.py. La clave no va aquí: la página la pide y la recuerda. -->
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pedidos web · Aureo</title>
<style>
  :root{--negro:#1A1A1A;--oro:#B8924A;--crema:#FAF7F0;--linea:#E6E0D4;--gris:#6B6B6B;--verde:#1E7B4A;--rojo:#B3261E;--aviso:#FFF4D6;--info:#EAF1FB;
    --lila:#8B5CC9;--lila-suave:#F3ECFC;--celeste:#2F86C8;--celeste-suave:#E6F2FB}
  *{box-sizing:border-box}
  body{margin:0;background:var(--crema);color:var(--negro);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--negro);color:#fff;padding:12px 16px}
  .fila-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
  header h1 span{color:var(--oro)}
  #ajustesBtn{background:none;border:1px solid #444;color:#ddd;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
  .barra{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .tab{border:1px solid #444;background:transparent;color:#ddd;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  .tab.on{background:var(--oro);border-color:var(--oro);color:#111;font-weight:700}
  .tab b{font-variant-numeric:tabular-nums}
  #buscar{flex:1;min-width:160px;border:0;border-radius:8px;padding:7px 10px;font-size:14px}
  #refrescar{background:none;border:0;color:#ddd;font-size:13px;cursor:pointer;text-decoration:underline}

  .layout{max-width:1180px;margin:0 auto;padding:14px 16px 60px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
  @media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}#resumen{order:-1}}
  #lista{min-width:0}
  .vacio{color:var(--gris);text-align:center;padding:40px 0}

  /* Resumen de lo que hay que armar (solo pedidos pagados y sin enviar) */
  #resumen{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px;position:sticky;top:120px}
  @media (max-width:980px){#resumen{position:static}}
  #resumen h2{margin:0 0 4px;font-size:16px}
  #resumen .sub{color:var(--gris);font-size:13px;margin-bottom:10px}
  #resumen table{width:100%;border-collapse:collapse;font-size:14px}
  #resumen td{padding:5px 0;border-top:1px solid var(--linea);vertical-align:top}
  #resumen td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;width:44px}
  #resumen h3{font-size:13px;margin:14px 0 4px;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  #resumen ul{margin:0;padding-left:18px;font-size:13px}
  #resumen li{margin:2px 0}
  .pildoras{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .pil{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
  .pil.paket{background:var(--lila-suave);color:var(--lila)}
  .pil.blue{background:var(--celeste-suave);color:var(--celeste)}
  /* Empacados: filtro Paket / Blue (24-nov-2026) */
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .subtabs button{border:1px solid var(--linea);background:#fff;color:var(--negro);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .subtabs button.on{background:var(--negro);border-color:var(--negro);color:#fff}
  .subtabs button.paket.on{background:var(--lila);border-color:var(--lila)}
  .subtabs button.blue.on{background:var(--celeste);border-color:var(--celeste)}
  .grupo{font-size:13px;font-weight:700;margin:14px 0 8px;padding:4px 10px;border-radius:8px;display:inline-block}
  .grupo.paket{background:var(--lila-suave);color:var(--lila)}
  .grupo.blue{background:var(--celeste-suave);color:var(--celeste)}
  details.res-movil>summary{font-weight:700;font-size:15px;color:var(--negro);list-style:none}
  @media (min-width:981px){details.res-movil>summary{pointer-events:none}}
  @media (max-width:980px){details.res-movil>summary::after{content:'  ▾ toca para ver';font-weight:400;font-size:13px;color:var(--gris)}details.res-movil[open]>summary::after{content:''}}

  .card{background:#fff;border:1px solid var(--linea);border-left:6px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:12px}
  .card.paket{border-left-color:var(--lila);background:linear-gradient(90deg,var(--lila-suave),#fff 140px)}
  .card.blue{border-left-color:var(--celeste);background:linear-gradient(90deg,var(--celeste-suave),#fff 140px)}
  .card.descartado{opacity:.6}
  /* Enviados como tabla tipo Excel (24-nov-2026): una fila por pedido, la primera columna dice si abrió las instrucciones */
  .layout.ancho{grid-template-columns:minmax(0,1fr)}.layout.ancho #resumen{display:none}
  .tabla-env{overflow-x:auto;background:#fff;border:1px solid var(--linea);border-radius:12px}
  .tabla-env table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
  .tabla-env th{text-align:left;font-size:12px;color:var(--gris);font-weight:700;padding:10px;border-bottom:2px solid var(--linea);background:var(--crema);position:sticky;top:0;white-space:nowrap}
  .tabla-env td{padding:12px 10px;border-bottom:1px solid var(--linea);vertical-align:middle}
  .tabla-env tr:hover td{background:#fafafa}
  .tabla-env tr.paket td:first-child{box-shadow:inset 5px 0 var(--lila)}
  .tabla-env tr.blue td:first-child{box-shadow:inset 5px 0 var(--celeste)}
  .tabla-env .vio{color:var(--verde);font-weight:700;white-space:nowrap}
  .tabla-env .novio{color:var(--gris);white-space:nowrap}
  .tabla-env .chico{font-size:12px;color:var(--gris);display:block;font-weight:400}
  .tabla-env .acc{display:flex;gap:6px;white-space:nowrap}
  .tabla-env .acc a,.tabla-env .acc button{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--negro)}
  .tabla-env .acc a.wsp{background:#25D366;border-color:#25D366;color:#fff}
  .tabla-env .acc a.wsp.rec{background:#fff4cc;border-color:#e0b400;color:var(--negro)}
  .tabla-env tr.cargando{opacity:.5;pointer-events:none}
  /* Cuadrito «Datos de envío» al lado de cada pedido (24-nov-2026): se muestra u oculta con el botón 📋 de la barra */
  .card.con-datos{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
  .cuerpo{min-width:0}
  @media (max-width:720px){.card.con-datos{grid-template-columns:minmax(0,1fr)}}
  .caja-datos .tit{font-size:13px;font-weight:700;margin-bottom:6px}
  .paket .caja-datos .tit{color:var(--lila)}
  .blue .caja-datos .tit{color:var(--celeste)}
  #verDatos{border:1px solid #444;background:transparent;color:#ddd;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  #verDatos.on{background:var(--oro);border-color:var(--oro);color:#111;font-weight:700}
  .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .cab .id{font-weight:700}
  .cab .cuando{color:var(--gris);font-size:13px}
  .badge{display:inline-block;margin-top:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
  .paket .badge{background:var(--lila);color:#fff}
  .blue .badge{background:var(--celeste);color:#fff}
  .acciones .empacar{background:#b8860b;color:#fff}
  .cambiar-emp{margin:4px 0 0 6px;border:1px solid var(--borde,#ddd);background:#fff;color:inherit;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer}
  .total{font-size:20px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .cliente{margin:8px 0 4px;font-size:16px;font-weight:600}
  .datos{color:#333;font-size:14px}
  .datos a{color:var(--verde);font-weight:600}
  .pidio{white-space:pre-wrap;background:var(--crema);border-radius:8px;padding:10px;margin:10px 0;font-size:14px}
  .aviso{background:var(--aviso);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:13px}
  .info{background:var(--info);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:13px}
  details{margin:8px 0}
  summary{cursor:pointer;color:var(--gris);font-size:13px}
  .fl{border-top:1px solid var(--linea);padding:8px 0;display:grid;grid-template-columns:1fr 1fr 1fr 28px;gap:6px;align-items:end}
  .fl .prod{grid-column:1/4}
  .fl label{font-size:11px;color:var(--gris);display:block}
  .fl input{width:100%;border:1px solid var(--linea);border-radius:6px;padding:6px 7px;font-size:14px}
  .fl input.num{text-align:right}
  .fl .sin{color:var(--rojo);font-size:11px;display:block;margin-top:2px}
  .fl button{border:0;background:none;color:var(--gris);cursor:pointer;font-size:18px;grid-row:1;grid-column:4}
  .mas{border:0;background:none;color:var(--verde);cursor:pointer;font-size:13px;padding:4px 0}
  .acciones{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .acciones button,.btn{flex:1;min-width:120px;border:0;border-radius:10px;padding:11px 10px;font-size:15px;font-weight:700;cursor:pointer}
  .javi,.caro,.enviar{background:var(--verde);color:#fff}
  .enviar[disabled]{background:#9DBFAD;cursor:not-allowed}
  .descartar,.suave{background:#eee;color:#333;flex:0 0 auto!important;min-width:0!important}
  .wsp{background:#25D366;color:#fff}
  .estado{margin-top:10px;font-weight:600;color:var(--verde)}
  .estado.gris{color:var(--gris)}
  .estado button{margin-left:8px;border:1px solid var(--linea);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}

  /* Envío: datos para Paket/Blue, seguimiento y foto */
  .envio{border-top:1px dashed var(--linea);margin-top:10px;padding-top:10px;display:grid;gap:10px}
  .datos-envio{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:8px 10px}
  .dato{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--linea)}
  .dato:last-of-type{border-bottom:0}
  .dato span{font-size:11px;color:var(--gris);display:block}
  .dato b{font-weight:600;word-break:break-word}
  .copiar{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
  .copiar-todo{margin-top:6px;width:100%;border:0;background:var(--negro);color:#fff;border-radius:8px;padding:8px;font-weight:600;cursor:pointer}
  .seg{display:flex;gap:8px}
  .seg input{flex:1;min-width:0;border:1px solid var(--linea);border-radius:8px;padding:9px 10px;font-size:15px}
  .seg button{border:0;border-radius:8px;padding:0 14px;background:var(--negro);color:#fff;font-weight:600;cursor:pointer}
  .lbl{font-size:12px;color:var(--gris);font-weight:600}
  .foto{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .foto label.subir{border:1px solid var(--negro);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;background:#fff}
  .foto input{display:none}
  .foto a{color:var(--verde);font-weight:600}
  .ok{color:var(--verde);font-weight:600}

  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90%;z-index:30}
  .cargando{opacity:.5;pointer-events:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal .caja{background:#fff;border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
  #mTxt{white-space:pre-line}
  .modal .botones{display:flex;gap:8px;margin-top:16px}
  .modal .botones button{flex:1;border:0;border-radius:10px;padding:11px;font-size:15px;font-weight:700;cursor:pointer}
  #mSi,#aGuardar{background:var(--verde);color:#fff}#mNo,#aCerrar{background:#eee;color:#333}
  .vista-msj{white-space:pre-wrap;background:var(--crema);border-radius:8px;padding:10px;font-size:14px;margin-top:8px}
  .modal label.campo{display:block;font-size:13px;color:var(--gris);margin-top:10px}
  .modal label.campo input,.modal label.campo textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--linea);border-radius:8px;padding:8px;font:inherit;color:var(--negro)}
  .modal textarea{min-height:150px}
  .chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}

  /* ---------- Bandeja sobria (Áureo, 25-nov-2026): lista a la izquierda y el pedido a la derecha, partido en
     «Para copiar» y «Pedido». Negro, dorado y crema, sin esquinas redondas. BLUE negro · PUNTO borde negro · PAKET dorado. ---------- */
  .layout{grid-template-columns:minmax(0,1fr)!important;max-width:1280px}
  #resumen.arriba{position:static;border-radius:0;margin:0 0 12px;padding:10px 14px}
  #resumen.arriba details.res-movil>summary{pointer-events:auto;cursor:pointer}
  #resumen.arriba table{max-width:520px}
  .pil{border-radius:0}.pil.paket{background:var(--oro);color:#fff}.pil.blue{background:var(--negro);color:#fff}
  .tab,#buscar{border-radius:0}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;margin-right:7px;vertical-align:2px;line-height:1.2;white-space:nowrap}
  .tag.tb{background:var(--negro);color:#fff;border:1px solid var(--negro)}
  .tag.tbp{background:#fff;color:var(--negro);border:1px solid var(--negro)}
  .tag.tp{background:var(--oro);color:#fff;border:1px solid var(--oro)}
  .tag.tf{background:#EFEAE0;color:var(--gris);border:1px solid var(--linea)}
  .md{display:grid;grid-template-columns:290px minmax(0,1fr);border:1px solid var(--linea);background:#fff;align-items:start}
  .md-lista{border-right:1px solid var(--linea);max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:110px}
  .it{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linea);background:#fff;padding:10px 12px;font:inherit;font-size:14px;color:var(--negro);cursor:pointer}
  .it:hover{background:var(--crema)}
  .it.on{background:var(--crema);box-shadow:inset 3px 0 var(--oro)}
  .it b{font-weight:600}
  .it-s{display:flex;justify-content:space-between;gap:8px;color:var(--gris);font-size:12px;margin-top:3px}
  .it-s span{color:var(--negro);font-variant-numeric:tabular-nums}
  .md-det{min-width:0}
  .md-det .card{border:0;border-radius:0;margin:0;background:#fff;padding:16px 20px}
  .det-cab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--linea)}
  .det-nom{font-size:18px}
  .det-sub{color:var(--gris);font-size:12px;margin-top:4px}
  .det-sub a{color:var(--negro)}
  .det-der{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .det-der .suave{border:1px solid var(--linea);background:#fff;padding:5px 12px;font:600 13px inherit;cursor:pointer;color:var(--negro)}
  .det-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
  .det-copiar{padding:14px 20px 4px 0;border-right:1px solid var(--linea);min-width:0}
  .det-pedido{padding:14px 0 4px 20px;min-width:0}
  .det-cols .tit{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);margin-bottom:8px}
  .datos-envio{border:0;border-radius:0;padding:0;background:none}
  .dato{padding:7px 0}
  .copiar{border-radius:0;color:var(--oro);font-weight:700}
  .copiar-todo{border-radius:0;margin-top:10px}
  .pidio{border-radius:0;margin:0 0 10px}
  .aviso,.info{border-radius:0}
  .acciones button,.btn{border-radius:0;font-size:14px;padding:10px}
  .javi,.caro,.enviar{background:var(--negro);color:#fff}
  .enviar[disabled]{background:#b9b5ad}
  .acciones .empacar{background:var(--oro);color:#fff}
  .descartar,.suave{background:#fff;color:var(--negro);border:1px solid var(--linea)!important}
  .estado{color:var(--negro)}
  .cambiar-emp{border-radius:0;margin:0}
  .fl input,.seg input,.seg button,.foto label.subir{border-radius:0}
  .subtabs button{border-radius:0}
  .subtabs button.paket.on,.subtabs button.blue.on{background:var(--negro);border-color:var(--negro)}
  .tabla-env{border-radius:0}
  .tabla-env tr.paket td:first-child,.tabla-env tr.blue td:first-child{box-shadow:none}
  .tabla-env .acc a,.tabla-env .acc button{border-radius:0}
  .tabla-env .acc a.wsp{background:#fff;border-color:var(--linea);color:var(--negro)}
  .tabla-env .acc a.wsp.rec{background:#fff;border-color:var(--oro);color:var(--negro)}
  .tabla-env .vio{color:var(--negro)}
  .modal .caja,.modal .botones button,.modal label.campo input,.modal label.campo textarea{border-radius:0}
  #mSi,#aGuardar,#eSi{background:var(--negro);color:#fff}#eNo{background:#eee;color:#333}
  .modal .caja.ancha{max-width:680px}
  .e-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.e-grid .ancho{grid-column:1/-1}
  .modal label.campo select{display:block;width:100%;margin-top:4px;border:1px solid var(--linea);padding:8px;font:inherit;background:#fff;color:var(--negro)}
  .e-suma{font-size:13px;color:var(--gris);margin:4px 0 0}.e-suma.mal{color:var(--rojo);font-weight:600}
  @media (max-width:820px){
    .md{grid-template-columns:minmax(0,1fr)}
    .md-lista{position:static;max-height:300px;border-right:0;border-bottom:2px solid var(--negro)}
    .det-cols{grid-template-columns:minmax(0,1fr)}
    .det-copiar{border-right:0;padding-right:0;border-bottom:1px solid var(--linea);padding-bottom:12px}
    .det-pedido{padding-left:0}
    .e-grid{grid-template-columns:1fr}
  }

  /* ---------- Inicio y Ventas (borrador v9, 22-nov-2026) ---------- */
  :root{--barra-dato:#96733A;--pista:#EFEAE0;color-scheme:light}
  /* Gráficos de línea y ganancia (v12, 25-nov-2026). Serie 1 azul y 2 naranja: par validado para daltónicos. */
  :root{--s1:#2a78d6;--s2:#eb6834;--antes:#A8A396;--ref:#8A8478;--malo:#C0392B}
  .lg{position:relative;margin-top:6px}
  .lg svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
  .lg .rej{stroke:var(--linea);stroke-width:1}
  .lg .ejy,.lg .ejx{fill:var(--gris);font-size:10px}
  .lg .ref{stroke:var(--ref);stroke-width:1;stroke-dasharray:4 4}
  .lg .refx{fill:var(--gris);font-size:10px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:3px}
  .lg .cruz{stroke:var(--negro);stroke-width:1;opacity:.35}
  .lg .tt{position:absolute;top:0;pointer-events:none;background:#fff;border:1px solid var(--linea);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:7px 9px;font-size:12px;white-space:nowrap;z-index:3}
  .lg .tt b{display:block;margin-bottom:3px}
  .lg .tt i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--gris);margin-top:4px}
  .leyenda i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .leyenda i.punteada{background:repeating-linear-gradient(90deg,var(--antes) 0 4px,transparent 4px 7px)!important}
  .kpi .chispa{display:block;width:100%;height:28px;margin-top:4px}
  [hidden]{display:none!important}
  button:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
  #vistas{display:flex;gap:4px}
  #vistas button{border:0;background:none;color:#bdb8ae;font:600 14px/1.2 inherit;padding:8px 12px;border-radius:8px;cursor:pointer}
  #vistas button.on{color:var(--oro);background:#2a2824}
  #vistas .globo{display:inline-block;min-width:18px;margin-left:5px;padding:1px 5px;border-radius:999px;background:var(--rojo);color:#fff;font-size:11px;text-align:center}
  #panel{max-width:1180px;margin:0 auto;padding:16px 16px 60px}

<script>
window.onerror = (m, s, l, c) => { const e = document.getElementById("lista"); if (e) e.innerHTML = `<p class="vacio">Error en la página: ${m} (línea ${l})</p>`; };
</script>
<script>
/* Ojo: Google corta lo que viene después de dos barras seguidas dentro de este código. Por eso los links se arman con 'https:\/\/'. */
function leerClave() { try { return localStorage.getItem('aureo-bandeja') || ''; } catch (e) { return ''; } }
function guardarClave(k) { try { localStorage.setItem('aureo-bandeja', k); } catch (e) { } }
let K = document.body.dataset.k || leerClave();
if (document.body.dataset.k) guardarClave(document.body.dataset.k);
let TODOS = [], FILTRO = 'Pendiente', editando = false, AJ = { linkBlue: '', linkPaket: '', mensaje: '' }, ABIERTOS = new Set();
const $ = s => document.querySelector(s);
const clp = n => '$' + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const WA = 'https:\/\/wa.me/';
/* Mensaje con texto: wa.me rompe los emojis al redirigir (cuadrado negro, 25-nov); api.whatsapp.com los respeta. */
const waTexto = (wa, texto) => 'https:\/\/api.whatsapp.com/send?phone=' + wa.slice(WA.length) + '&text=' + encodeURIComponent(texto);
function toast(t, ms = 3500) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms); }
function preguntar(txt, extra) {
  return new Promise(ok => {
    $('#mTxt').textContent = txt; $('#mExtra').innerHTML = extra || ''; $('#modal').style.display = 'flex';
    const fin = v => { const chk = $('#mCorreo'); $('#modal').style.display = 'none'; $('#mSi').onclick = $('#mNo').onclick = null; ok(v ? { si: true, correo: chk ? chk.checked : false } : null); };
    $('#mSi').onclick = () => fin(true); $('#mNo').onclick = () => fin(false);
  });
}
/* Dos formas de hablar con el script (Áureo, 20-nov-2026):
   - Abierta desde Google (/exec): google.script.run, como siempre.
   - Página propia aureocl.github.io/bandeja (API_URL lleno): pedido directo al script, sin pasar por el inicio de sesión de Google.
     Así no importa cuántas cuentas de Google tenga abiertas el celular («No se puede abrir el archivo en este momento»). */
const API_URL = 'https://script.google.com/macros/s/AKfycbyJwpVPwnc0EVQPGTlspepBK-zva0MWBjMAvwbXVlOlazQt22XV7UJyCg_qh-M9lYxu/exec';
const llamarCon = (clave, fn, ...a) => API_URL
  ? fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: fn, clave, args: a }) })
      .then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error || 'Error'); return r.r; })
  : new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn](clave, ...a));
const llamar = (fn, ...a) => llamarCon(K, fn, ...a);
const telWa = t => { const d = String(t).replace(/\D/g, ''); return d.length === 9 ? '56' + d : d; };

async function cargar() {
  try {
    const r = await llamar('listar');
    TODOS = r.pedidos; AJ = r.ajustes || AJ; CARGADO = true;
    $('#cat').innerHTML = r.catalogo.map(c => `<option value="${esc(c)}">`).join('');
    pintar();
  } catch (e) {
    if (/Clave incorrecta/.test(e.message)) { guardarClave(''); K = ''; pedirClave(true); return; }
    $('#lista').innerHTML = `<p class="vacio">No pude leer los pedidos: ${esc(e.message)}</p>`;
    if (!CARGADO) $('#panel').innerHTML = `<p class="vacio">No pude leer los pedidos: ${esc(e.message)}</p>`;
  }
}

/* «Empacado» no es un estado en la planilla: es un pagado con «Empacado el». Sale del resumen y espera el despacho. */
const etapa = p => p.estado === 'Pagado' && p.empacadoEl ? 'Empacado' : p.estado;

/* Empacados: todos juntos (primero Paket, después Blue) o filtrados por empresa, para despachar de a una. */
let EMP = 'todos';
function listaEmpacados(L) {
  const pk = L.filter(p => claseEmp(p) === 'paket'), bl = L.filter(p => claseEmp(p) === 'blue');
  const chip = (v, txt, n, c) => `<button class="${c} ${EMP === v ? 'on' : ''}" data-emp="${v}">${txt} · ${n}</button>`;
  const h = `<div class="subtabs">${chip('todos', 'Todos', L.length, '')}${chip('paket', 'Paket', pk.length, 'paket')}${chip('blue', 'Blue Express', bl.length, 'blue')}</div>`;
  const G = EMP === 'todos' ? L : EMP === 'paket' ? pk : bl;
  return h + (G.length ? maestroDetalle(G) : `<p class="vacio">No hay empacados por ${EMP === 'paket' ? 'Paket' : 'Blue Express'}.</p>`);
}

/* Enviados en tabla, el último enviado arriba. 👀 = el cliente apretó «Ver instrucciones» en el correo (columna «Abrió»):
   le llegó y no hay que insistirle. */
const claveFecha = v => { const m = /(\d{2})-(\d{2})-(\d{4})(?:\s+(\d{2}:\d{2}))?/.exec(String(v || '')); return m ? `${m[3]}-${m[2]}-${m[1]} ${m[4] || '00:00'}` : ''; };
function tablaEnviados(L) {
  L = L.slice().sort((a, b) => claveFecha(b.enviadoEl).localeCompare(claveFecha(a.enviadoEl)));
  const fila = p => {
    const tel = String(p.tel).replace(/\D/g, ''), wa = tel ? WA + telWa(tel) : '';
    const visto = p.abrio ? `<span class="vio" title="Apretó «Ver instrucciones» en el correo">👀 Sí<span class="chico">${esc(p.abrio)}</span></span>`
      : p.porFuera ? '<span class="novio" title="Entregado en mano: no lleva correo">🤝 En mano</span>'
      : !p.mail ? '<span class="novio" title="No dejó correo">— Sin correo</span>'
      : conLinkArmar(p) ? '<span class="novio">Aún no</span>' : '<span class="novio" title="Enviado antes del 25-nov: el correo no traía el link">— Sin dato</span>';
    const rec = !p.abrio && !p.porFuera && wa ? `<a class="wsp rec" target="_blank" href="${waTexto(wa, recordatorio(p))}" title="Recordar por WhatsApp (lleva su link de instrucciones: al abrirlo queda 👀 Sí)">🔔</a>` : '';
    const emp = tagEmp(p);
    const link = !p.porFuera && p.seguimiento ? linkSeg(p) : '';
    const seg = p.porFuera ? `<span class="chico">${esc(p.aviso.replace(/^Entregado por fuera: /, ''))}</span>` : link ? `<a href="${esc(link)}" target="_blank">${esc(p.seguimiento)}</a>` : esc(p.seguimiento || '—');
    return `<tr class="${claseEmp(p)}" data-id="${esc(p.id)}">
      <td>${visto}</td>
      <td style="white-space:nowrap">${esc(p.enviadoEl.replace(/^'/, '').slice(0, 10))}</td>
      <td><b>${esc(p.numero)}</b><span class="chico">${esc(p.id)}</span></td>
      <td><b>${esc(p.cliente)}</b><span class="chico">${wa ? `<a href="${wa}" target="_blank">${esc(p.tel)}</a>` : esc(p.tel)}</span></td>
      <td>${esc(p.comuna)}<span class="chico">${esc(p.region)}</span></td>
      <td style="white-space:nowrap">${emp}</td>
      <td>${seg}</td>
      <td style="white-space:nowrap;text-align:right">${clp(p.total)}<span class="chico">pagó a ${esc(p.cuenta)}</span></td>
      <td><div class="acc">${rec}${!p.porFuera && wa ? `<a class="wsp" target="_blank" href="${waTexto(wa, mensaje(p))}" title="Avisar por WhatsApp">💬</a>` : ''}${!p.porFuera && p.mail ? '<button data-reenviar title="Reenviar correo">✉️</button>' : ''}${p.foto ? `<a href="${esc(p.foto)}" target="_blank" title="Ver foto del paquete">📷</a>` : ''}<button data-editar title="Editar datos, productos o total">✏️</button></div></td>
    </tr>`;
  };
  const vistos = L.filter(p => p.abrio).length;
  return `<p style="margin:0 0 8px;font-size:13px;color:var(--gris)">👀 ${vistos} de ${L.length} ya abrieron las instrucciones del correo (a esos no hay que insistirles).</p>
    <div class="tabla-env"><table><thead><tr><th>👀 Vio</th><th>Enviado</th><th>Pedido</th><th>Cliente</th><th>Comuna</th><th>Empresa</th><th>Seguimiento</th><th style="text-align:right">Total</th><th></th></tr></thead>
    <tbody>${L.map(fila).join('')}</tbody></table></div>`;
}

/* «'dd-MM-yyyy HH:mm» → «yyyy-MM-dd HH:mm» para ordenar; sin fecha de pago, al final. */
function clavePago(p) {
  const m = /(\d{2})-(\d{2})-(\d{4})(?:\s+(\d{2}:\d{2}))?/.exec(String(p.pagadoEl || ''));
  return m ? `${m[3]}-${m[2]}-${m[1]} ${m[4] || '00:00'}` : '9999';
}

function pintar() {
  pintarPanel();
  const cuenta = s => TODOS.filter(p => etapa(p) === s).length;
  $('#nP').textContent = cuenta('Pendiente'); $('#nG').textContent = cuenta('Pagado'); $('#nK').textContent = cuenta('Empacado'); $('#nE').textContent = cuenta('Enviado'); $('#nD').textContent = cuenta('Descartado');
  const q = norm($('#buscar').value);
  const L = TODOS.filter(p => etapa(p) === FILTRO && (!q || norm([p.id, p.cliente, p.tel, p.mail, p.comuna, p.seguimiento, p.numero].join(' ')).includes(q)));
  // Por armar y Empacados: primero el que pagó antes (Áureo, 24-nov). La fecha que cuenta es «Pagado el», no cuándo hizo el pedido.
  if (FILTRO === 'Pagado' || FILTRO === 'Empacado') L.sort((a, b) => clavePago(a).localeCompare(clavePago(b)));
  const vacios = { Pendiente: 'No hay pedidos esperando pago.', Pagado: 'No hay pedidos pagados por armar.', Empacado: 'No hay pedidos empacados esperando despacho.', Enviado: 'Todavía no hay pedidos enviados.', Descartado: 'Nada por aquí.' };
  const arriba = FILTRO === 'Pagado' ? '<aside id="resumen" class="arriba"></aside>' : '';
  $('#lista').innerHTML = arriba + (FILTRO === 'Enviado' && L.length ? tablaEnviados(L) : FILTRO === 'Empacado' && L.length ? listaEmpacados(L) : L.length ? maestroDetalle(L) : `<p class="vacio">${vacios[FILTRO]}</p>`);
  pintarResumen();
  editando = false;
}

/* ---------- Resumen: lo que hay que armar (solo pagados sin enviar) ---------- */
function pintarResumen() {
  if (!$('#resumen')) return;
  const P = TODOS.filter(p => etapa(p) === 'Pagado'), K = TODOS.filter(p => etapa(p) === 'Empacado').length;
  const paket = P.filter(p => p.empresa === 'Paket').length, blue = P.length - paket;
  const tot = {}, camisetas = [], regalos = [], empaques = [];
  P.forEach(p => (p.armar || []).forEach(x => {
    if (x.n === 'Camiseta con escudo') { camisetas.push(`${x.det} · ${p.cliente.split(' ')[0]}`); }
    else if (x.n === 'Minifigura sorpresa de regalo') { regalos.push(p.cliente.split(' ')[0] + (x.det ? ` (${x.det})` : '')); }
    else if (x.n === 'Empaque de regalo') { empaques.push(p.cliente.split(' ')[0] + (x.det ? ` ${x.det}` : '')); }
    tot[x.n] = (tot[x.n] || 0) + Number(x.c || 0);
  }));
  const filas = Object.entries(tot).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const cuerpo = !P.length ? '<p class="sub" style="margin:0">Cuando marquen «Pagó a Javi/Caro», lo que hay que armar aparece aquí.</p>' : `
    <div class="pildoras"><span class="pil paket">Santiago · Paket: ${paket}</span><span class="pil blue">Regiones · Blue: ${blue}</span></div>
    <table>${filas.map(([n, c]) => `<tr><td>${esc(n)}</td><td class="n">${c}</td></tr>`).join('')}</table>
    ${camisetas.length ? `<h3>Camisetas (${camisetas.length})</h3><ul>${camisetas.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    ${regalos.length ? `<h3>Mini sorpresa de regalo (${regalos.length})</h3><ul>${regalos.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}

const claseEmp = p => p.empresa === 'Paket' ? 'paket' : 'blue';

function tarjeta(p) {

    <div class="tit">Pedido</div>

    ${p.necesita ? `<div class="info">Lo necesita para: <b>${esc(p.necesita)}</b></div>` : ''}${p.esRegalo ? '<div class="info">🎁 Es regalo</div>' : ''}`;
  if (p.previo) h += `<div class="info">↺ ${esc(p.previo)}</div>`;

    if (p.panel && p.panel.declarado) h += `<div class="info">Dice que transfirió a ${esc(p.panel.declarado)}: míralo en el banco antes de confirmar.</div>`;
    (p.avisos || []).forEach(a => h += `<div class="aviso">⚠ ${esc(a)}</div>`);
    const sin = p.filas.some(f => !f.enCatalogo);
    h += `<details ${sin ? 'open' : ''}><summary>Cómo queda en el maestro (VENTAS)${sin ? ' · hay productos sin costo en CATALOGO' : ''}</summary>
      <div class="filas">${p.filas.map((f, i) => fila(f, i)).join('')}</div>
      <button class="mas" data-mas>+ agregar fila</button></details>
    <div class="acciones"><button class="javi" data-pago="Javi">Pagó a Javi</button><button class="caro" data-pago="Caro">Pagó a Caro</button><button class="descartar" data-descartar>Descartar</button></div>`;
  } else if (p.estado === 'Pagado') {
    h += `<div class="estado">✓ Pagó a ${esc(p.cuenta)}${p.pagadoEl ? ' · ' + esc(p.pagadoEl.replace(/^'/, '')) : ''} · ${p.empacadoEl ? '📦 empacado ' + esc(p.empacadoEl.replace(/^'/, '')) + ', falta despachar' : 'por armar'}</div>
    <div class="envio">
      <div><div class="lbl">N° de seguimiento</div><div class="seg"><input data-seg value="${esc(p.seguimiento)}" placeholder="Pega aquí el número de ${p.empresa === 'Paket' ? 'Paket' : 'Blue'}" inputmode="text"><button data-guardar-seg>Guardar</button></div>
        ${p.seguimiento ? `<div class="ok" style="font-size:13px;margin-top:4px">✓ Guardado: ${esc(p.seguimiento)}</div>` : ''}</div>
      <div><div class="lbl">Foto del paquete</div><div class="foto">
        <label class="subir">📷 ${p.foto ? 'Cambiar foto' : 'Subir foto'}<input type="file" accept="image/*" data-foto></label>
        ${p.foto ? `<a href="${esc(p.foto)}" target="_blank">✓ Ver foto</a>` : '<span style="color:var(--gris);font-size:13px">Opcional: va en el correo al cliente</span>'}</div></div>
    </div>
    <div class="acciones"><button class="enviar" data-enviado ${p.seguimiento ? '' : 'disabled title="Primero guarda el N° de seguimiento"'}>✓ Marcar como enviado</button><button class="suave" data-por-fuera title="Lo llevamos nosotros, un conocido o lo retiró: sin seguimiento ni correo">🤝 Entregado por fuera</button>${p.empacadoEl ? '<button class="suave" data-desempacar>Volver a por armar</button>' : '<button class="empacar" data-empacar>📦 Listo, empacado</button><button class="suave" data-volver>Volver a pendiente</button>'}</div>`;
  } else if (p.estado === 'Enviado' && p.porFuera) {
    h += `<div class="estado">🤝 Entregado ${esc(p.enviadoEl.replace(/^'/, ''))} · pedido ${esc(p.numero)} en el maestro · pagó a ${esc(p.cuenta)}</div>
      <div class="datos" style="margin-top:6px">${esc(p.aviso)}</div>`;

      <div class="acciones"><a class="btn wsp" style="text-align:center;text-decoration:none" target="_blank" href="${wa ? waTexto(wa, mensaje(p)) : '#'}">💬 Avisar por WhatsApp</a>${p.mail ? '<button class="suave" data-reenviar>✉️ Reenviar correo</button>' : ''}</div>`;
  } else {
    h += `<div class="estado gris">Descartado <button data-reabrir>Volver a pendientes</button></div>`;
  }
  return h + '</div></div></div>';
}

/* Cuadrito por pedido con lo que pide cada empresa, en su orden (Áureo, 24-nov-2026):
   Blue domicilio: nombre, apellido, teléfono, correo, dirección (+ comuna y región).
   Punto Blue: nombre, apellido, teléfono, correo, región, comuna y el punto (el cliente da una dirección de referencia).
   Paket: nombre, teléfono, dirección y comuna. */
function partirNombre(n) {
  const w = String(n || '').trim().split(/\s+/).filter(Boolean);
  const k = w.length >= 4 ? 2 : 1;   // «María José Candia Ramírez» → María José / Candia Ramírez
  return [w.slice(0, k).join(' '), w.slice(k).join(' ')];
}
function telEnvio(t) { const d = String(t || '').replace(/\D/g, ''); return d.length === 11 && d.startsWith('56') ? d.slice(2) : d; }
function datosEnvio(p) {
  const [nom, ape] = partirNombre(p.cliente), tel = telEnvio(p.tel);
  let D, tit;
  if (p.empresa === 'Paket') { tit = 'Para Paket'; D = [['Nombre', p.cliente], ['Teléfono', tel], ['Dirección', p.dir], ['Comuna', p.comuna]]; }
  else if (p.entrega === 'Domicilio') { tit = 'Para Blue Express · domicilio'; D = [['Nombre', nom], ['Apellido', ape], ['Teléfono', tel], ['Correo', p.mail], ['Dirección', p.dir], ['Comuna', p.comuna], ['Región', p.region]]; }
  else { tit = 'Para Blue Express · Punto Blue'; D = [['Nombre', nom], ['Apellido', ape], ['Teléfono', tel], ['Correo', p.mail], ['Región', p.region], ['Comuna', p.comuna], ['Punto Blue (el más cercano a)', p.dir]]; }
  const todo = D.map(([k, v]) => `${k}: ${v || ''}`).join('\n');
  return `<div class="datos-envio"><div class="tit">Para copiar · ${tit.replace(/^Para /, '')}</div>${D.map(([k, v]) => `<div class="dato"><div><span>${esc(k)}</span><b>${esc(v || '—')}</b></div>${v ? `<button class="copiar" data-copiar="${esc(v)}">Copiar</button>` : ''}</div>`).join('')}
    <button class="copiar-todo" data-copiar="${esc(todo)}">Copiar todo</button></div>`;
}

/* Mismo mensaje que arma el servidor (correo): para el botón de WhatsApp. */
function linkSeg(p) {
  const base = p.empresa === 'Paket' ? AJ.linkPaket : AJ.linkBlue;
  if (!base) return '';
  return base.includes('{n}') ? base.replace('{n}', encodeURIComponent(p.seguimiento)) : base;
}
/** Recordatorio por WhatsApp: mismo link del correo, así al abrirlo se marca 👀 Sí. */
const RECORDATORIO_BASE = '¡Hola {nombre}! 😊 Te escribimos de Aureo: tu pedido ya va en camino.\n\nLo lleva: {empresa}\nN° de seguimiento: {seguimiento}\n{link}\n\nY aquí tienes las instrucciones para armarlo, colgarlo y tu misión Áureo:\n{instrucciones}\n\nCualquier duda, escríbenos por aquí.';
function recordatorio(p) {
  const link = linkSeg(p), nombre = String(p.cliente || '').trim().split(/\s+/)[0] || '';
  return String(AJ.recordatorio || RECORDATORIO_BASE).replace(/\{nombre\}/g, nombre)
    .replace(/\{empresa\}/g, p.empresa === 'Paket' ? 'Paket' : 'Blue Express').replace(/\{seguimiento\}/g, p.seguimiento || '')
    .replace(/\{link\}/g, link ? 'Síguelo aquí: ' + link : '')
    .replace(/\{instrucciones\}/g, p.linkArmar || 'https:\/\/aureocl.github.io/armar/').replace(/\n{3,}/g, '\n\n').trim();
}
/** El correo trae el link de instrucciones desde el 25-nov-2026: antes de eso no hay cómo saber si lo abrió. */
function conLinkArmar(p) {
  const m = String(p.enviadoEl || '').replace(/^'/, '').match(/^(\d{2})-(\d{2})-(\d{4})/);
  return !!m && (m[3] + m[2] + m[1]) >= '20261125';
}

function mensaje(p) {
  const link = linkSeg(p), nombre = String(p.cliente || '').trim().split(/\s+/)[0] || '';
  return String(AJ.mensaje || '').replace(/\{nombre\}/g, nombre).replace(/\{empresa\}/g, p.empresa === 'Paket' ? 'Paket' : 'Blue Express')
    .replace(/\{seguimiento\}/g, p.seguimiento).replace(/\{link\}/g, link ? 'Síguelo aquí: ' + link : '').replace(/\n{3,}/g, '\n\n').trim();
}

const envioInput = v => `<div class="env"><label>Envío cobrado</label><input class="num" data-k="Envio Cobrado" inputmode="numeric" value="${esc(v)}"></div>`;
function fila(f, i) {
  return `<div class="fl"><div class="prod"><label>Producto</label><input list="cat" data-k="Producto" value="${esc(f.Producto)}">${f.enCatalogo === false ? '<span class="sin">No está en CATALOGO: entra sin costo</span>' : ''}</div>
    <button data-quitar title="Quitar fila">×</button>
    <div><label>Cantidad</label><input class="num" data-k="Cantidad" inputmode="numeric" value="${esc(f.Cantidad)}"></div>
    <div><label>Precio unit.</label><input class="num" data-k="Precio Unit." inputmode="numeric" value="${esc(f['Precio Unit.'])}"></div>
    ${i === 0 ? envioInput(f['Envio Cobrado']) : '<div></div>'}</div>`;
}

function leerFilas(card) {
  return [...card.querySelectorAll('.fl')].map((tr, i) => {
    const o = {};
    tr.querySelectorAll('input').forEach(x => o[x.dataset.k] = x.dataset.k === 'Producto' ? x.value.trim() : Number(String(x.value).replace(/\D/g, '') || 0));
    if (i === 0 && !('Envio Cobrado' in o)) o['Envio Cobrado'] = 0;
    return o;
  }).filter(o => o.Producto && o.Cantidad > 0);
}

/* Foto del celular: se achica a 1600 px antes de subirla (más rápida y liviana). */
function achicar(file) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => mal(new Error('No pude leer la foto'));
    img.src = url;
  });
}

async function accion(card, fn, ...a) {
  card.classList.add('cargando');
  try { const r = await llamar(fn, ...a); await cargar(); return r; }
  catch (e) { card.classList.remove('cargando'); toast('No se pudo: ' + e.message, 6000); return null; }
}

document.addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b || b.closest('.modal')) return;
  if (b.classList.contains('tab')) { document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b)); FILTRO = b.dataset.f; pintar(); return; }
  if (b.dataset.emp) { EMP = b.dataset.emp; pintar(); return; }
  if (b.id === 'refrescar') { toast('Actualizando…', 1200); cargar(); return; }
  if (b.id === 'ajustesBtn') { $('#aBlue').value = AJ.linkBlue; $('#aPaket').value = AJ.linkPaket; $('#aMsj').value = AJ.mensaje; $('#aRec').value = AJ.recordatorio || ''; $('#ajustes').style.display = 'flex'; return; }
  if ('copiar' in b.dataset) { try { await navigator.clipboard.writeText(b.dataset.copiar); b.textContent = '✓ Copiado'; } catch (e) { toast('Mantén apretado el texto para copiarlo'); } setTimeout(() => { b.textContent = b.classList.contains('copiar-todo') ? 'Copiar todo' : 'Copiar'; }, 1500); return; }
  if (b.dataset.sel) {
    SEL = b.dataset.sel; pintar();
    if (matchMedia('(max-width:820px)').matches) { const d = $('.md-det'); if (d) d.scrollIntoView({ behavior: 'smooth' }); }
    return;
  }
  const card = b.closest('.card, tr[data-id]'); if (!card) return;
  const id = card.dataset.id, p = TODOS.find(x => x.id === id);
  if ('editar' in b.dataset) { abrirEditar(p); return; }
  if ('quitar' in b.dataset) {
    const fs = card.querySelector('.filas'), x = b.closest('.fl'), env = x.querySelector('.env');
    x.remove();
    const primera = fs.querySelector('.fl');
    if (env && primera) primera.lastElementChild.outerHTML = env.outerHTML;
    editando = true; return;
  }
  if ('mas' in b.dataset) { const fs = card.querySelector('.filas'); fs.insertAdjacentHTML('beforeend', fila({ Producto: '', Cantidad: 1, 'Precio Unit.': 0, 'Envio Cobrado': 0 }, fs.children.length)); editando = true; return; }
  if (b.dataset.pago) {
    const filas = leerFilas(card);
    if (!filas.length) { toast('No quedó ningún producto'); return; }
    const suma = filas.reduce((s, f) => s + f.Cantidad * f['Precio Unit.'], 0) + (filas[0]['Envio Cobrado'] || 0);
    const dif = suma !== p.total ? `\n\nOjo: las filas suman ${clp(suma)} y el pedido dice ${clp(p.total)}.` : '';
    if (!await preguntar(`¿${p.cliente} pagó ${clp(p.total)} a ${b.dataset.pago}?\n\nQueda «Por armar» y entra al resumen de lo que hay que armar. Al maestro pasa cuando lo marquen como enviado.${dif}`)) return;
    const r = await accion(card, 'confirmar', id, b.dataset.pago, filas);
    if (r) toast('✓ Pagado: quedó en «Por armar»');
    return;
  }
  if (b.dataset.empresa) {
    const a = b.dataset.empresa === 'Paket' ? 'Paket' : 'Blue Express';
    if (!await preguntar(`¿Mandar el pedido de ${p.cliente} por ${a}?\n\nCambia los datos para copiar, el link de seguimiento y lo que queda en el maestro.${p.seguimiento ? '\n\nOjo: ya tiene un N° de seguimiento guardado; revisa que sea de ' + a + '.' : ''}`)) return;
    const r = await accion(card, 'cambiarEmpresa', id, b.dataset.empresa);
    if (r) toast('✓ Ahora va por ' + a);
    return;
  }
  if ('guardarSeg' in b.dataset) {
    const v = card.querySelector('[data-seg]').value.trim();
    const r = await accion(card, 'guardarSeguimiento', id, v);
    if (r) toast(v ? '✓ N° de seguimiento guardado' : 'N° de seguimiento borrado');
    return;
  }
  if ('enviado' in b.dataset) {
    const msj = mensaje(p);
    const extra = `<div class="vista-msj">${esc(msj)}</div>
      ${p.mail ? `<label class="chk"><input type="checkbox" id="mCorreo" checked> Mandar este mensaje por correo a ${esc(p.mail)}${p.foto ? ' (con la foto)' : ''}</label>` : '<p style="font-size:13px;color:var(--gris)">Este cliente no dejó correo: avísale por WhatsApp.</p>'}
      ${linkSeg(p) ? '' : `<p class="aviso">Falta cargar el link de seguimiento de ${p.empresa === 'Paket' ? 'Paket' : 'Blue Express'} en ⚙︎ Ajustes: el mensaje va sin link.</p>`}
      ${p.foto ? '' : '<p style="font-size:13px;color:var(--gris)">No tiene foto del paquete.</p>'}`;
    const r = await preguntar(`¿Marcar como enviado el pedido de ${p.cliente}?\n\nSe anota en el maestro (VENTAS) con el siguiente N° de pedido y el seguimiento ${p.seguimiento}.`, extra);
    if (!r) return;
    const x = await accion(card, 'marcarEnviado', id, r.correo);
    if (x) toast(`✓ Enviado: pedido ${x.numero} en el maestro · ${x.aviso}`, 6000);
    return;
  }
  if ('porFuera' in b.dataset) {
    const extra = `<label class="campo">¿Quién lo entregó?<select id="fQuien" style="display:block;width:100%;margin-top:4px;border:1px solid var(--linea);border-radius:8px;padding:8px;font:inherit">
        <option value="">Elige…</option><option value="Javi">Lo llevó Javi</option><option value="Caro">Lo llevó Caro</option>
        <option value="Conocido">Un conocido (le pagamos)</option><option value="Retiro">Lo retiró el cliente</option></select></label>
      <label class="campo">¿Cuánto pagamos de envío? (0 si no pagamos nada)<input id="fCosto" type="number" min="0" step="100" inputmode="numeric" value="0"></label>
      <label class="campo" id="fPagoL" style="display:none">¿Quién lo pagó?<select id="fPago" style="display:block;width:100%;margin-top:4px;border:1px solid var(--linea);border-radius:8px;padding:8px;font:inherit">
        <option value="Caro">Caro</option><option value="Javi">Javi</option></select></label>
      <p style="font-size:13px;color:var(--gris)">No se le manda correo ni seguimiento al cliente.</p>`;
    const pedir = preguntar(`¿${p.cliente} ya tiene su pedido en la mano?\n\nSe anota en el maestro (VENTAS) como «Entregado», con el siguiente N° de pedido y lo que pagamos de envío.`, extra);
    const ver = () => { $('#fPagoL').style.display = Number($('#fCosto').value) > 0 ? 'block' : 'none'; };

    const quien = $('#fQuien').value, costo = Number($('#fCosto').value || 0), pago = $('#fPago').value;
    if (!quien) { toast('Elige quién lo entregó'); return; }
    if (!(costo >= 0)) { toast('El costo del envío tiene que ser un número'); return; }
    if (quien === 'Conocido' && !costo && !await preguntar('¿El conocido lo llevó gratis? Quedará con envío $0.')) return;
    const x = await accion(card, 'marcarPorFuera', id, quien, costo, pago);

    return;
  }
  if ('volver' in b.dataset) {
    if (!await preguntar(`¿Volver el pedido de ${p.cliente} a pendiente? (sale del resumen; el maestro no se toca)`)) return;
    await accion(card, 'volverPendiente', id);
    return;
  }

/* ---------- Inicio y Ventas (borrador v9, 22-nov-2026) ----------
   Todo sale de listar(): no se guarda nada aparte.
   Venta = pedido Pagado o Enviado, contado el día que se marcó el pago, con el envío cobrado incluido. */
let VISTA = 'inicio', PERIODO = '7', CARGADO = false, ELEGIDA = {};
const HORA = 36e5, DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const dd = n => String(n).padStart(2, '0');
/* Las fechas de la planilla son hora de Chile escrita como texto: se comparan como hora de pared. */

  return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)) : null;

function ahoraChile() {
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: 'America/Santiago', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })

const dia0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

const cuandoPago = p => aFecha(p.pagadoEl) || aFecha(p.recibido);
const ventasEntre = (a, b) => TODOS.filter(p => pagado(p) && entre(cuandoPago(p), a, b));
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const duracion = h => h < 1 ? 'menos de 1 h' : h < 48 ? `${Math.round(h)} h` : `${Math.round(h / 24)} días`;
function mediana(L) {
  if (!L.length) return null;
  const s = [...L].sort((a, b) => a - b), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function rango(clave, ya) {
  const hoy = dia0(ya);
  if (clave === 'mes') {
    const ini = new Date(ya.getFullYear(), ya.getMonth(), 1), finAnt = new Date(ya.getFullYear(), ya.getMonth(), 0);
    return { ini, fin: ya, antIni: new Date(ya.getFullYear(), ya.getMonth() - 1, 1), vs: 'mes pasado a esta fecha',
      antFin: new Date(finAnt.getFullYear(), finAnt.getMonth(), Math.min(ya.getDate(), finAnt.getDate()), ya.getHours(), ya.getMinutes()) };
  }
  const n = clave === 'hoy' ? 1 : +clave, ini = masDias(hoy, 1 - n);

}
function variacion(a, b, vs) {

  const v = Math.round((a - b) / Math.abs(b) * 100);
  return `<div class="var ${v > 0 ? 'sube' : v < 0 ? 'baja' : ''}">${v > 0 ? '▲' : v < 0 ? '▼' : '='} ${Math.abs(v)} % vs ${vs}</div>`;
}

/* Piezas */
function columnas(id, datos, texto, bajo) {
  const max = Math.max(1, ...datos.map(d => d.v));
  let sel = ELEGIDA[id];
  if (sel === undefined || sel >= datos.length) sel = datos.reduce((m, d, i) => d.v > datos[m].v ? i : m, 0);
  const cada = Math.ceil(datos.length / 7);
  return `<div class="lectura" data-lectura="${id}">${esc(datos[sel].largo)}: ${esc(texto(datos[sel]))}</div>
    <div class="graf${bajo ? ' bajo' : ''}">${datos.map((d, i) => `<button class="${i === sel ? 'sel' : ''}" data-graf="${id}" data-i="${i}" data-texto="${esc(d.largo + ': ' + texto(d))}" aria-label="${esc(d.largo + ': ' + texto(d))}"><i style="height:${d.v ? Math.max(d.v / max * 100, 2) : 0}%"></i></button>`).join('')}</div>
    <div class="eje">${datos.map((d, i) => `<span>${(datos.length - 1 - i) % cada ? '' : esc(d.corto)}</span>`).join('')}</div>
    <details><summary>Ver en tabla</summary><table class="datos-g">${datos.map(d => `<tr><td>${esc(d.largo)}</td><td>${esc(texto(d))}</td></tr>`).join('')}</table></details>`;
}
function filasBarra(L, max) {
  if (!L.length) return '<div class="sin-datos">Todavía no hay datos en este período.</div>';
  const tope = max || Math.max(1, ...L.map(x => x.v));
  return L.map(x => `<div class="hb"><div class="r"><span>${esc(x.n)}</span><b>${esc(x.t)}</b></div><div class="pista"><i style="width:${Math.min(100, x.v / tope * 100)}%"></i></div></div>`).join('');
}
/* ---------- Gráficos de línea estilo Shopify (v12, 25-nov-2026) ----------
   lineas(id, x, series, opc): x = [{corto, largo}], series = [{n, color, dash, v:[números]}] (todas del largo de x),
   opc = {fmt, refs:[{v, n}], barras:true (una serie: barras verdes/rojas desde $0)}. Un solo eje. Al pasar el dedo o el mouse,
   línea vertical + cuadro con los valores del día. Siempre con «Ver en tabla». */
const GRAF = {};
const clpCorto = n => { const a = Math.abs(n), s = n < 0 ? '−' : ''; return a >= 1e6 ? `${s}$${(a / 1e6).toFixed(1).replace('.', ',')}M` : a >= 1000 ? `${s}$${Math.round(a / 1000)}k` : `${s}$${Math.round(a)}`; };
function lineas(id, x, series, opc = {}) {
  const fmt = opc.fmt || clp, refs = opc.refs || [], W = innerWidth < 640 ? Math.max(300, innerWidth - 60) : 600, H = innerWidth < 640 ? 200 : 190, L = 42, R = 8, T = 10, B = 22, n = x.length;
  if (!n) return '<div class="sin-datos">Todavía no hay datos en este período.</div>';
  const todos = [...series.flatMap(s => s.v), ...refs.map(r => r.v), 0];
  let min = Math.min(...todos), max = Math.max(...todos);
  if (max === min) max = min + 1;
  const pad = (max - min) * .08; max += pad; if (min < 0) min -= pad;
  const X = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), Y = v => T + (max - v) / (max - min) * (H - T - B);
  // Marcas «redondas» (0, 10k, 20k…), siempre incluyendo el $0.
  const crudo = (max - min) / 5, mag = 10 ** Math.floor(Math.log10(crudo)), paso0 = [1, 2, 5, 10].map(k => k * mag).find(k => k >= crudo);
  const marcas = []; for (let v = Math.ceil(min / paso0) * paso0; v <= max; v += paso0) marcas.push(v);
  const paso = (W - L - R) / Math.max(1, n - 1), ancho = Math.max(2, Math.min(18, paso * .6));
  const cada = Math.ceil(n / (W < 600 ? 5 : 7));
  let svg = marcas.map(v => `<line class="rej" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ejy" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${opc.corto ? opc.corto(v) : clpCorto(v)}</text>`).join('');
  if (min < 0) svg += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--gris)" stroke-width="1"/>`;
  svg += refs.map(r => `<line class="ref" x1="${L}" x2="${W - R}" y1="${Y(r.v)}" y2="${Y(r.v)}"/><text class="refx" x="${W - R}" y="${Y(r.v) - 4}" text-anchor="end">${esc(r.n)}</text>`).join('');
  if (opc.barras) {
    const s = series[0];
    svg += s.v.map((v, i) => { const y0 = Y(0), y1 = Y(v), h = Math.abs(y1 - y0); if (!v) return '';
      return `<rect x="${X(i) - ancho / 2}" y="${Math.min(y0, y1)}" width="${ancho}" height="${Math.max(h, 1)}" rx="3" fill="${v >= 0 ? 'var(--verde)' : 'var(--malo)'}"/>`; }).join('');
  } else {
    svg += series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ''} points="${s.v.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}"/>`).join('');
    if (n === 1) svg += series.map(s => `<circle cx="${X(0)}" cy="${Y(s.v[0])}" r="4" fill="${s.color}"/>`).join('');
  }
  svg += x.map((d, i) => (n - 1 - i) % cada ? '' : `<text class="ejx" x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(d.corto)}</text>`).join('');
  GRAF[id] = { x, series, fmt, X, W, n };
  const leyenda = series.length > 1 ? `<div class="leyenda">${series.map(s => `<span><i class="${s.dash ? 'punteada' : ''}" style="background:${s.color}"></i>${esc(s.n)}</span>`).join('')}</div>` : '';
  const tabla = `<details><summary>Ver en tabla</summary><div class="tabla-mov"><table class="datos-g"><tr><td></td>${series.map(s => `<td>${esc(s.n)}</td>`).join('')}</tr>${
    x.map((d, i) => `<tr><td>${esc(d.largo)}</td>${series.map(s => `<td>${esc(fmt(s.v[i]))}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
  return `${leyenda}<div class="lg" data-lg="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opc.alt || 'Gráfico')}">${svg}<line class="cruz" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/></svg><div class="tt" hidden></div></div>${tabla}`;

function verLinea(caja, clientX) {
  const g = GRAF[caja.dataset.lg]; if (!g) return;
  const svg = caja.querySelector('svg'), r = svg.getBoundingClientRect(), xs = (clientX - r.left) / r.width * g.W;
  let i = 0; for (let k = 1; k < g.n; k++) if (Math.abs(g.X(k) - xs) < Math.abs(g.X(i) - xs)) i = k;
  const cruz = svg.querySelector('.cruz'), tt = caja.querySelector('.tt'), px = g.X(i) / g.W * r.width;
  cruz.setAttribute('x1', g.X(i)); cruz.setAttribute('x2', g.X(i)); cruz.setAttribute('visibility', 'visible');
  tt.innerHTML = `<b>${esc(g.x[i].largo)}</b>${g.series.map(s => `<div><i style="background:${s.color}"></i>${esc(s.n)}: <b style="display:inline">${esc(g.fmt(s.v[i]))}</b></div>`).join('')}`;
  tt.hidden = false;
  const w = tt.offsetWidth; tt.style.left = Math.max(0, Math.min(r.width - w, px + 12 > r.width - w ? px - w - 12 : px + 12)) + 'px';

document.addEventListener('pointermove', ev => { const c = ev.target.closest && ev.target.closest('[data-lg]'); if (c) verLinea(c, ev.clientX); });
document.addEventListener('pointerdown', ev => { const c = ev.target.closest && ev.target.closest('[data-lg]'); if (c) verLinea(c, ev.clientX); });
document.addEventListener('pointerout', ev => { const c = ev.target.closest && ev.target.closest('[data-lg]');
  if (c && !c.contains(ev.relatedTarget)) { c.querySelector('.tt').hidden = true; c.querySelector('.cruz').setAttribute('visibility', 'hidden'); } });
/* Mini línea dentro de una tarjeta (sin ejes): solo la forma de la tendencia. */
function chispa(v, color = 'var(--barra-dato)') {
  if (v.length < 2) return '';
  const mx = Math.max(...v, 0), mn = Math.min(...v, 0), H = 28, W = 100, Y = x => H - 2 - (x - mn) / ((mx - mn) || 1) * (H - 4);
  return `<svg class="chispa" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" points="${v.map((x, i) => `${(i * W / (v.length - 1)).toFixed(1)},${Y(x).toFixed(1)}`).join(' ')}"/></svg>`;
}
const pieza = (titulo, nota, cuerpo, clase = '') => `<section class="pz ${clase}"><h2>${titulo}</h2><p class="nota">${nota}</p>${cuerpo}</section>`;

/* Inicio: primero lo que hay que hacer, después lo que se vendió */
function htmlInicio() {
  const ya = ahoraChile(), hoy = rango('hoy', ya), sem = rango('7', ya);
  const H = ventasEntre(hoy.ini, ya), A = ventasEntre(hoy.antIni, hoy.antFin), S = ventasEntre(sem.ini, ya);
  const de = e => TODOS.filter(p => etapa(p) === e);
  const pen = de('Pendiente'), arm = de('Pagado'), emp = de('Empacado');
  const espera = (L, f) => Math.max(0, ...L.map(p => { const d = f(p); return d ? (ya - d) / HORA : 0; }));
  const declaran = pen.filter(p => p.panel && p.panel.declarado).length;
  const precios = pen.filter(p => (p.avisos || []).some(a => /catálogo|pack vale|permitido|20 %|descuento interno|Dice que lo ingresó/.test(a)));
  const tarea = (f, L, titulo, detalle, horas) => {
    const urge = L.length > 0 && horas >= 24;
    return `<button class="tarea ${urge ? 'urge' : ''} ${L.length ? '' : 'cero'}" data-ir-pedidos="${f}"><span class="num">${L.length}</span><span class="tx"><b>${titulo}</b><small>${L.length ? detalle : 'Al día'}</small>${urge ? `<small class="alerta">⚠ El más antiguo espera hace ${duracion(horas)}</small>` : ''}</span><span aria-hidden="true">›</span></button>`;
  };
  const tareas = [
    tarea('Pendiente', pen, 'Confirmar pagos', `${clp(vendido(pen))} por cobrar${declaran ? ` · ${plural(declaran, 'dice que ya transfirió', 'dicen que ya transfirieron')}` : ''}`, espera(pen, p => aFecha(p.recibido))),
    tarea('Pagado', arm, 'Armar', `${clp(vendido(arm))} ya pagados`, espera(arm, cuandoPago)),
    tarea('Empacado', emp, 'Despachar', `Paket ${emp.filter(p => p.empresa === 'Paket').length} · Blue ${emp.filter(p => p.empresa !== 'Paket').length}`, espera(emp, p => aFecha(p.empacadoEl))),
  ];
  if (precios.length) tareas.push(`<button class="tarea urge" data-ir-pedidos="Pendiente"><span class="num">!</span><span class="tx"><b>Revisar antes de confirmar</b><small>${plural(precios.length, 'pedido trae', 'pedidos traen')} un precio o descuento que revisar</small></span><span aria-hidden="true">›</span></button>`);
  const semana = Array.from({ length: 7 }, (_, i) => {
    const d = masDias(dia0(ya), i - 6), L = ventasEntre(d, new Date(+masDias(d, 1) - 1));
    return { v: vendido(L), n: L.length, corto: DIAS[d.getDay()], largo: etiquetaDia(d) };
  });
  const NOMBRE = { Pendiente: 'Esperando pago', Pagado: 'Por armar', Empacado: 'Por despachar', Enviado: 'Enviado', Descartado: 'Descartado' };
  const ult = TODOS.slice(0, 5).map(p => `<button class="ultimo" data-ir-pedidos="${esc(etapa(p))}" data-buscar="${esc(p.id)}"><span class="tx"><b>${esc(p.cliente)}</b><small>${esc(p.recibido)} · ${esc(NOMBRE[etapa(p)] || etapa(p))}</small></span><span class="der">${clp(p.total)}</span></button>`).join('');
  return `<div class="pnl">
    <section class="pz hero"><div class="et">Vendido hoy · ${etiquetaDia(ya)}</div><div class="grande">${clp(vendido(H))}</div>${variacion(vendido(H), vendido(A), hoy.vs)}
      <div class="trio"><div><b>${H.length}</b><span>pagados hoy</span></div><div><b>${H.length ? clp(vendido(H) / H.length) : '—'}</b><span>ticket de hoy</span></div><div><b>${clp(vendido(S))}</b><span>últimos 7 días</span></div></div></section>

  const ganando = bloqueGanando({ R, hoy, en, ing, conC, mg, ADS, llave, signo, kpi });

  const grupo = (f, L = V) => {

/* ---------- ¿Estamos ganando? (script v12, 25-nov-2026) ----------
   Ganancia = margen (ingresos − costo de productos − costo de envío) − gasto de Meta con IVA. Sin gastos fijos.
   Metas DIARIAS de Áureo: equilibrio, $50.000, $100.000 y $200.000. Pedidos necesarios = (Meta al día + meta) ÷ margen promedio
   por pedido de los últimos 30 días. Meta al día = promedio de los últimos 7 días con gasto cargado. */
const METAS_DIA = [[0, 'Punto de equilibrio'], [50000, 'Ganar $50.000 al día'], [100000, 'Ganar $100.000 al día'], [200000, 'Ganar $200.000 al día']];
function bloqueGanando({ R, hoy, en, ing, conC, mg, ADS, llave, signo, kpi }) {
  if (!HIST.ads) return pieza('¿Estamos ganando?', 'Falta instalar en Google la versión 12 del script «Aureo · Pedidos web» (pestaña ADS con el gasto de Meta).', '', 'ancho');
  if (!ADS.size) return pieza('¿Estamos ganando?', 'Todavía no hay gasto de Meta cargado en la pestaña ADS del maestro. Pídele a Claude «actualiza los ads».', '', 'ancho');
  const fechas = [...ADS.keys()].sort(), [ua, um, ud] = fechas[fechas.length - 1].split('-').map(Number), ultimo = new Date(ua, um - 1, ud);
  const metaEntre = (a, b) => { let g = 0, m = 0; for (let d = a; d <= b; d = masDias(d, 1)) { const o = ADS.get(llave(d)); if (o) { g += o.g; m += o.m; } } return { g, m }; };
  // Margen promedio por pedido: últimos 30 días con costo conocido.
  const L30 = conC(en(masDias(hoy, -29), hoy)), mgProm = L30.length ? mg(L30) / L30.length : 0;
  // Ritmo de Meta: últimos 7 días hasta el último día cargado.
  const metaDia = metaEntre(masDias(ultimo, -6), ultimo).g / 7;
  // El período se mide solo hasta el último día con gasto cargado (hoy recién se carga mañana).
  // …y desde el primer día con gasto cargado (en «Todo», los meses sin ADS no se comparan con nada).
  const [pa, pm, pd] = fechas[0].split('-').map(Number), primero = new Date(pa, pm - 1, pd), ini = primero > R.ini ? primero : R.ini;
  const fin = ultimo < R.fin ? ultimo : R.fin, dias = Math.max(1, Math.round((fin - ini) / 864e5) + 1);
  if (fin < ini) return pieza('¿Estamos ganando?', `El gasto de Meta está cargado hasta el ${etiquetaDia(ultimo)}: todavía no hay datos de este período.`, '', 'ancho');
  const V = en(ini, fin), M = metaEntre(ini, fin), conCosto = conC(V);
  const margen = mg(conCosto), gan = margen - M.g, pedDia = V.length / dias;
  // Día a día, para los gráficos.
  const X = [], gMg = [], gMeta = [], gGan = [], gPed = [];
  for (let d = ini; d <= fin; d = masDias(d, 1)) {
    const Ld = en(d, d), m = mg(conC(Ld)), me = (ADS.get(llave(d)) || { g: 0 }).g;
    X.push({ corto: `${d.getDate()}/${d.getMonth() + 1}`, largo: etiquetaDia(d) }); gMg.push(m); gMeta.push(me); gGan.push(m - me); gPed.push(Ld.length);
  }
  const pedPara = meta => mgProm > 0 ? Math.ceil((metaDia + meta) / mgProm) : null;
  const graficos = `
    <h3 style="margin:18px 0 0;font-size:14px">Margen y gasto de Meta, día a día</h3>
    <p class="nota">Cuando la línea azul va arriba de la naranja, ese día ganamos.</p>
    ${lineas('mgmeta', X, [{ n: 'Margen del día', color: 'var(--s1)', v: gMg }, { n: 'Gasto en Meta', color: 'var(--s2)', v: gMeta }], { alt: 'Margen y gasto de Meta por día' })}
    <h3 style="margin:18px 0 0;font-size:14px">Ganancia de cada día</h3>
    <p class="nota">Verde = ganamos ese día · rojo = perdimos. La línea punteada es la meta de ganar $50.000 al día.</p>
    ${lineas('ganancia', X, [{ n: 'Ganancia', color: 'var(--verde)', v: gGan }], { barras: true, refs: [{ v: 50000, n: 'Meta $50.000' }], fmt: signo, alt: 'Ganancia después de Meta por día' })}
    <h3 style="margin:18px 0 0;font-size:14px">Pedidos por día</h3>
    <p class="nota">Las líneas punteadas marcan cuántos pedidos hacen falta para no perder y para ganar $50.000.</p>
    ${lineas('pedidos', X, [{ n: 'Pedidos', color: 'var(--s1)', v: gPed }], { fmt: v => plural(v, 'pedido', 'pedidos'), corto: v => String(Math.round(v)),
      refs: pedPara(0) === null ? [] : [{ v: pedPara(0), n: `Equilibrio: ${pedPara(0)}` }, { v: pedPara(50000), n: `$50.000: ${pedPara(50000)}` }], alt: 'Pedidos por día' })}`;
  const filas = METAS_DIA.map(([meta, nombre]) => {
    const necesita = metaDia + meta, ped = mgProm > 0 ? Math.ceil(necesita / mgProm) : null, ok = ped !== null && pedDia >= ped;
    return `<tr${ok ? ' style="color:var(--verde,#1a7f37);font-weight:600"' : ''}><td>${ok ? '✓ ' : ''}${nombre}</td><td>${clp(necesita)}</td><td>${ped === null ? '—' : ped}</td></tr>`;
  }).join('');
  return `<section class="pz ancho"><h2>¿Estamos ganando?</h2>
    <p class="nota">Margen − gasto de Meta con IVA, del ${etiquetaDia(ini)} al ${etiquetaDia(fin)}. Sin gastos fijos.</p>
    <div class="kpis">
      ${kpi('Gasto en Meta', clp(M.g), `<div class="var">${clp(M.g / dias)} al día</div>${chispa(gMeta, 'var(--s2)')}`)}
      ${kpi('Ganancia después de Meta', signo(gan), `<div class="var ${gan >= 0 ? 'sube' : 'baja'}">${signo(gan / dias)} al día</div>${chispa(gGan, gan >= 0 ? 'var(--verde)' : 'var(--malo)')}`)}
      ${kpi('Costo de Meta por pedido', V.length ? clp(M.g / V.length) : '—', `<div class="var ${V.length && M.g / V.length <= 5000 ? 'sube' : 'baja'}">meta ≤ $5.000</div>`)}
      ${kpi('Retorno de Meta', M.g ? (ing(V) / M.g).toFixed(1).replace('.', ',') + ' ×' : '—', `<div class="var">ventas ÷ gasto${M.m ? ` · ${clp(M.g / M.m)} por mensaje` : ''}</div>`)}
    </div>
    <p class="nota" style="margin-top:12px">Cuántos pedidos tienen que salir <b>cada día</b>. Meta hoy gasta ~${clp(metaDia)} al día (últimos 7 días) y cada pedido deja ~${clp(mgProm)} de margen (promedio de 30 días).
      Vamos en <b>${pedDia.toFixed(1).replace('.', ',')} pedidos al día</b> en este período.</p>
    <div class="tabla-mov"><table class="datos-g mes"><tr><td>Meta</td><td>Margen al día</td><td>Pedidos al día</td></tr>${filas}</table></div>
    ${graficos}
    ${conCosto.length < V.length ? `<p class="nota">${plural(V.length - conCosto.length, 'pedido no tiene', 'pedidos no tienen')} costo: no entra${V.length - conCosto.length === 1 ? '' : 'n'} al margen.</p>` : ''}
  </section>`;
}

function pintarPanel() {
  document.body.classList.toggle('sin-clave', !K);
  document.body.dataset.vista = K ? VISTA : 'pedidos';
  document.querySelectorAll('#vistas button').forEach(b => b.classList.toggle('on', b.dataset.vista === VISTA));
  if (!K) return;
  const n = TODOS.filter(p => p.estado === 'Pendiente').length;
  $('#nVista').textContent = n; $('#nVista').hidden = !n;
  if (VISTA === 'pedidos') return;
  if (!CARGADO) { $('#panel').innerHTML = '<p class="vacio">Cargando ventas…</p>'; return; }
  const abiertas = [...$('#panel').querySelectorAll('details')].map(d => d.open), vista = $('#panel').dataset.pintada;
  $('#panel').innerHTML = VISTA === 'inicio' ? htmlInicio() : htmlVentas();
  $('#panel').dataset.pintada = VISTA + PERIODO + FUENTE + PERIODO_T;
  if (vista === VISTA + PERIODO + FUENTE + PERIODO_T) $('#panel').querySelectorAll('details').forEach((d, i) => { d.open = !!abiertas[i]; });
}
function verLectura(b) {
  const l = document.querySelector(`[data-lectura="${b.dataset.graf}"]`);
  if (l) l.textContent = b.dataset.texto;
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('#vistas button,#panel button');
  if (!b) return;
  if (b.dataset.graf) {
    ELEGIDA[b.dataset.graf] = +b.dataset.i;
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
    verLectura(b); return;
  }
  if (b.dataset.periodo) { PERIODO = b.dataset.periodo; pintarPanel(); return; }
  if (b.dataset.periodoT) { PERIODO_T = b.dataset.periodoT; pintarPanel(); return; }
  if (b.dataset.fuente) { FUENTE = b.dataset.fuente; pintarPanel(); return; }
  if ('recargarHist' in b.dataset) { HIST = null; pedirHistorial(true); pintarPanel(); return; }
  if (b.dataset.irPedidos) {
    FILTRO = b.dataset.irPedidos; $('#buscar').value = b.dataset.buscar || '';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.f === FILTRO));
    VISTA = 'pedidos';
  } else if (b.dataset.vista) VISTA = b.dataset.vista;
  else return;
  // La lista solo se vuelve a dibujar si no están corrigiendo un pedido (si no, se borra lo escrito).
  if (b.dataset.irPedidos || !editando) pintar();
  pintarPanel();
  window.scrollTo(0, 0);
});
document.addEventListener('mouseover', ev => { const b = ev.target.closest('[data-graf]'); if (b) verLectura(b); });
document.addEventListener('focusin', ev => { if (ev.target.matches('[data-graf]')) verLectura(ev.target); });

/* Se actualiza sola cada minuto (salvo que estén escribiendo o con una ventana abierta). */
setInterval(() => {
  const ocupado = editando || document.hidden || $('#modal').style.display === 'flex' || $('#ajustes').style.display === 'flex' || $('#editar').style.display === 'flex' || (document.activeElement && document.activeElement.matches('input,textarea'));
  if (K && !ocupado) cargar();
}, 60000);
function pedirClave(error) {
  pintarPanel();
  $('#lista').innerHTML = `<div class="card" style="max-width:420px;margin:30px auto">
    <div class="cliente" style="margin-top:0">Escribe la clave de la bandeja</div>
    <p class="datos">Se pide una sola vez en este navegador. La tiene Áureo.</p>
    ${error ? '<div class="aviso">Esa clave no sirve. Revísala.</div>' : ''}
    <div class="fl" style="grid-template-columns:1fr;border:0"><input id="clave" type="password" autocomplete="off" placeholder="Clave"></div>
    <div class="acciones"><button class="javi" id="entrar">Entrar</button></div></div>`;
  const ir = async () => {
    const k = $('#clave').value.trim(); if (!k) return;
    try { await llamarCon(k, 'probarClave'); K = k; guardarClave(k); pintarPanel(); cargar(); }
    catch (e) { pedirClave(true); }
  };
  $('#entrar').onclick = ir; $('#clave').onkeydown = ev => { if (ev.key === 'Enter') ir(); };
}
if (K) cargar(); else pedirClave(false);
</script>
</body>

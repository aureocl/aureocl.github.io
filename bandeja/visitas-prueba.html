<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aureo · Visitas (prueba)</title>
<meta name="robots" content="noindex">
<style>
  :root{--negro:#1A1A1A;--oro:#B8924A;--crema:#FAF7F0;--linea:#E6E0D4;--gris:#6B6B6B;--verde:#1E7B4A;--rojo:#B3261E;--aviso:#FFF4D6;
    --barra-dato:#96733A;--pista:#EFEAE0;--celeste:#2F86C8;--celeste-suave:#E6F2FB;--lila:#8B5CC9;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--crema);color:var(--negro);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--negro);color:#fff;padding:12px 16px}
  .fila-h{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
  header h1{margin:0;font-size:17px;font-weight:700}
  header h1 span{color:var(--oro)}
  #vistas{display:flex;gap:4px}
  #vistas button{border:0;background:none;color:#bdb8ae;font:600 14px/1.2 inherit;padding:8px 12px;border-radius:8px;cursor:default}
  #vistas button.on{color:var(--oro);background:#2a2824}
  .aviso-prueba{background:var(--aviso);border-bottom:1px solid #EBD9A6;color:#6b5414;font-size:13px;text-align:center;padding:7px 12px}
  #panel{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
  .periodo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;background:var(--pista);border-radius:12px;margin-bottom:12px}
  .periodo button{border:0;background:none;color:inherit;border-radius:9px;min-height:40px;font:600 13px/1.2 inherit;cursor:pointer}
  .periodo button.on{background:var(--negro);color:var(--oro)}
  .pnl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .pnl .ancho{grid-column:1/-1}
  .pz{min-width:0;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px}
  .pz h2{margin:0;font-size:15px}
  .pz .nota{margin:2px 0 10px;color:var(--gris);font-size:12px}
  .hero{background:var(--negro);border-color:var(--negro);color:#fff}
  .hero .et{color:#bdb8ae;font-size:13px}
  .hero .grande{font-size:40px;line-height:1.1;font-weight:700;margin:4px 0}
  .hero .var{color:#bdb8ae}.hero .var.sube{color:#79D6A7}.hero .var.baja{color:#FFA59E}
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #38352f}
  .trio b{display:block;font-size:17px}.trio span{color:#bdb8ae;font-size:11px}
  .var{font-size:12px;color:var(--gris)}.var.sube{color:var(--verde)}.var.baja{color:var(--rojo)}
  .vivo{display:flex;align-items:center;gap:8px;font-size:13px;color:#bdb8ae}
  .punto{width:10px;height:10px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:late 1.8s infinite}
  @keyframes late{70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
  .ahora{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
  .ahora li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid #38352f}
  .ahora li span:last-child{color:#bdb8ae;white-space:nowrap}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .kpi .et{color:var(--gris);font-size:12px}
  .kpi .val{font-size:23px;font-weight:700;margin:3px 0;white-space:nowrap}

  /* Columnas */
  .lectura{min-height:20px;font-size:13px;font-weight:600}
  .graf{height:160px;display:flex;align-items:stretch;border-bottom:1px solid var(--linea);margin-top:6px}
  .graf.bajo{height:110px}
  .graf button{flex:1;min-width:0;padding:0 1px;border:0;background:none;display:flex;align-items:flex-end;justify-content:center;gap:1px;cursor:pointer}
  .graf button i{display:block;width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--barra-dato)}
  .graf button i.b{background:var(--celeste)}
  .graf button.sel{background:var(--pista)}
  .eje{display:flex;margin-top:4px}
  .eje span{flex:1;min-width:0;color:var(--gris);font-size:10px;text-align:center;white-space:nowrap;display:flex;justify-content:center}
  .leyenda{display:flex;gap:14px;font-size:12px;color:var(--gris);margin-top:8px;flex-wrap:wrap}
  .leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* Barras horizontales */
  .hb{margin-top:10px}
  .hb .r{display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .hb .r b{white-space:nowrap}
  .pista{height:8px;background:var(--pista);border-radius:4px;margin-top:4px;overflow:hidden}
  .pista i{display:block;height:100%;background:var(--barra-dato);border-radius:0 4px 4px 0}
  .pista.dos{height:auto;background:none;display:grid;gap:3px}
  .pista.dos i{height:8px}.pista.dos i.b{background:var(--celeste)}
  .ojo{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--rojo);background:#F9DEDB;border-radius:999px;padding:1px 7px}

  /* Embudo */
  .embudo{display:grid;gap:2px}
  .paso{display:grid;grid-template-columns:170px minmax(0,1fr) 70px;gap:10px;align-items:center}
  .paso .n{font-size:13px;font-weight:600}
  .paso .bar{height:30px;background:var(--pista);border-radius:6px;overflow:hidden}
  .paso .bar i{display:block;height:100%;background:var(--barra-dato);border-radius:6px}
  .paso.final .bar i{background:var(--verde)}
  .paso .c{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .paso .c small{display:block;font-weight:400;color:var(--gris);font-size:11px}
  .fuga{font-size:11.5px;color:var(--gris);padding:2px 0 4px 182px}
  @media (max-width:760px){.fuga{padding-left:120px}}
  .fuga.peor{color:var(--rojo);font-weight:700}

  /* Tabla de orígenes */
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{text-align:left;font-size:11px;color:var(--gris);font-weight:700;padding:6px 4px;border-bottom:2px solid var(--linea)}
  table.t td{padding:8px 4px;border-bottom:1px solid var(--linea);vertical-align:middle}
  table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.t .mini{height:6px;background:var(--pista);border-radius:3px;margin-top:4px;overflow:hidden}
  table.t .mini i{display:block;height:100%;background:var(--barra-dato)}
  .mejor{color:var(--verde);font-weight:700}

  /* Dona */
  .dona{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .dona ul{list-style:none;margin:0;padding:0;font-size:13px;flex:1;min-width:150px}
  .dona li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--linea)}
  .dona li:first-child{border-top:0}
  .dona li i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

  /* Velocidad */
  .vel-top{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}
  .vel-top div b{display:block;font-size:22px}
  .vel-top div span{font-size:12px;color:var(--gris)}
  .semaforo{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
  .semaforo.ok{background:#DDF3E6;color:var(--verde)}.semaforo.medio{background:var(--aviso);color:#8a6400}.semaforo.mal{background:#F9DEDB;color:var(--rojo)}
  svg text{font:10px -apple-system,Segoe UI,Roboto,sans-serif;fill:var(--gris)}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--pista);border-radius:999px;padding:4px 10px;font-size:13px}
  .chip b{margin-left:4px;color:var(--gris);font-weight:600}
  .lista{list-style:none;margin:0;padding:0}
  .lista li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--linea);font-size:13px}
  .lista li:first-child{border-top:0}
  .lista .num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--pista);font-weight:700}
  .lista .num.urge{background:#F9DEDB;color:var(--rojo)}
  .lista .num.ok{background:#DDF3E6;color:var(--verde)}
  .lista small{display:block;color:var(--gris)}
  .estado{margin-left:auto;white-space:nowrap;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--pista);color:var(--gris)}
  .estado.espera{background:var(--aviso);color:#8a6400}

  @media (max-width:760px){
    .pnl{grid-template-columns:minmax(0,1fr)}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    #vistas{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:var(--negro);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
    #vistas button{min-height:48px;padding:8px 4px}
    #panel{padding-bottom:90px}
    .hero .grande{font-size:36px}
    .paso{grid-template-columns:110px minmax(0,1fr) 58px;gap:8px}
    .paso .n{font-size:12px}
    .ocultar-movil{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="fila-h"><h1>Aureo <span>· Tienda</span></h1>
    <nav id="vistas" aria-label="Secciones"><button>Inicio</button><button>Ventas</button><button class="on">Visitas</button><button>Pedidos</button></nav>
  </div>
</header>
<div class="aviso-prueba">Versión de prueba · <b>todos los números son de ejemplo</b>. La página todavía no anota las visitas.</div>
<main id="panel">
  <div class="periodo" id="periodo">
    <button data-p="hoy">Hoy</button><button data-p="7" class="on">7 días</button><button data-p="30">30 días</button><button data-p="mes">Este mes</button>
  </div>
  <div class="pnl" id="pnl"></div>
</main>

<script>
/* ---------- Datos de ejemplo (se reemplazan por la hoja VISITAS cuando la página anote las visitas) ---------- */
let semilla = 7;
const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
const entre = (a, b) => Math.round(a + azar() * (b - a));
const miles = n => n.toLocaleString('es-CL');
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const pctTxt = v => String(v).replace('.', ',') + ' %';
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const HOY = new Date(2026, 10, 25);

function datos(p) {
  semilla = {hoy: 3, '7': 7, '30': 30, mes: 11}[p];
  const n = p === 'hoy' ? 24 : p === '7' ? 7 : p === '30' ? 30 : 25;
  const serie = [];
  for (let i = 0; i < n; i++) {
    let v, largo, corto;
    if (p === 'hoy') {
      const curva = [2,1,1,0,0,1,2,4,7,10,13,15,17,16,15,16,18,21,26,31,35,33,22,9][i];
      v = i > 15 ? 0 : Math.round(curva * (0.8 + azar() * 0.5));
      largo = `${i}:00 a ${i}:59`; corto = String(i);
    } else {
      const d = new Date(HOY); d.setDate(HOY.getDate() - (n - 1 - i));
      const finde = d.getDay() === 0 || d.getDay() === 6;
      v = entre(150, 260) + (finde ? 70 : 0) + i * 2;
      largo = `${DIAS[d.getDay()]} ${d.getDate()}-${d.getMonth() + 1}`; corto = p === '7' ? DIAS[d.getDay()] : String(d.getDate());
    }
    const ped = Math.round(v * (0.03 + azar() * 0.025));
    serie.push({v, ped, largo, corto});
  }
  const visitas = serie.reduce((s, x) => s + x.v, 0);
  const anterior = Math.round(visitas * (0.78 + azar() * 0.3));
  const f = [1, 0.62, 0.17, 0.105, 0.062, 0.052, 0.036];
  const embudo = ['Entró a la página','Vio un producto','Agregó al pedido','Empezó el pedido','Llegó a pagar / WhatsApp','Pedido guardado (AU-…)','Pagó']
    .map((nombre, i) => ({nombre, v: Math.round(visitas * f[i] * (i ? 0.92 + azar() * 0.16 : 1))}));
  for (let i = 1; i < embudo.length; i++) embudo[i].v = Math.min(embudo[i].v, embudo[i - 1].v);
  const pedidos = embudo[5].v, pagaron = embudo[6].v;
  const personas = Math.round(visitas * 0.71);
  const origenes = [
    ['Anuncio de Meta', 0.46, 0.028], ['Instagram (bio y historias)', 0.21, 0.061], ['Agente de WhatsApp', 0.12, 0.118],
    ['Directo / link guardado', 0.10, 0.044], ['QR de la tarjeta (/armar)', 0.06, 0.035], ['Google', 0.05, 0.052]
  ].map(([n, part, conv]) => { const v = Math.round(visitas * part); return {n, v, ped: Math.max(0, Math.round(v * conv * (0.85 + azar() * 0.3)))}; });
  const productos = [
    ['Colo-Colo', 0.19, 0.050], ['Universidad de Chile', 0.14, 0.047], ['Universidad Católica', 0.10, 0.052], ["O'Higgins", 0.07, 0.044],
    ['Real Madrid', 0.08, 0.012], ['Santiago Wanderers', 0.05, 0.048], ['Goku mini (3D)', 0.06, 0.016], ['Bad Bunny · Un verano sin ti', 0.04, 0.020]
  ].map(([n, part, conv]) => { const vis = Math.round(embudo[1].v * part); return {n, vis, ven: Math.round(vis * conv)}; });
  const ofertas = [['Pack de camisetas del mismo equipo', 0.92, 0.24], ['Completa la colección (20 %)', 0.55, 0.11], ['Mini de regalo', 0.48, 0.63], ['Prioridad en el despacho', 0.88, 0.07]]
    .map(([n, vista, acepta]) => { const v = Math.round(embudo[3].v * vista); return {n, v, a: Math.round(v * acepta)}; });
  const velocidad = serie.map((x, i) => ({t: x.largo, p50: +(2.1 + azar() * 0.8 - (p === 'hoy' ? 0 : i * 0.01)).toFixed(1)}))
    .map(x => ({...x, p75: +(x.p50 + 1.1 + azar() * 0.9).toFixed(1)}));
  return {p, serie, visitas, anterior, personas, embudo, pedidos, pagaron, origenes, productos, ofertas, velocidad,
    celular: 0.86, errores: {fotos: entre(0, 6), js: entre(0, 3), cortados: Math.max(0, embudo[3].v - embudo[5].v)}};
}

/* ---------- Piezas ---------- */
const ELEGIDA = {};
const pieza = (titulo, nota, cuerpo, clase = '') => `<section class="pz ${clase}"><h2>${titulo}</h2><p class="nota">${nota}</p>${cuerpo}</section>`;
const variacion = (a, b, vs) => { const v = Math.round((a - b) / b * 100); return `<div class="var ${v > 0 ? 'sube' : v < 0 ? 'baja' : ''}">${v > 0 ? '▲' : v < 0 ? '▼' : '='} ${Math.abs(v)} % vs ${vs}</div>`; };

function columnas(id, D, texto, opc = {}) {
  const max = Math.max(1, ...D.map(d => d.v));
  let sel = ELEGIDA[id]; if (sel === undefined || sel >= D.length) sel = D.reduce((m, d, i) => d.v > D[m].v ? i : m, 0);
  const cada = Math.ceil(D.length / (opc.marcas || 8));
  return `<div class="lectura" id="lec-${id}">${esc(D[sel].largo)}: ${esc(texto(D[sel]))}</div>
    <div class="graf${opc.bajo ? ' bajo' : ''}">${D.map((d, i) => `<button class="${i === sel ? 'sel' : ''}" data-graf="${id}" data-i="${i}" data-texto="${esc(d.largo + ': ' + texto(d))}">
      <i style="height:${d.v ? Math.max(d.v / max * 100, 2) : 0}%"></i>${opc.segunda ? `<i class="b" style="height:${d.v2 ? Math.max(d.v2 / opc.max2 * 100, 2) : 0}%"></i>` : ''}</button>`).join('')}</div>
    <div class="eje">${D.map((d, i) => `<span>${(D.length - 1 - i) % cada ? '' : esc(d.corto)}</span>`).join('')}</div>`;
}
const barras = L => { const tope = Math.max(1, ...L.map(x => x.v)); return L.map(x => `<div class="hb"><div class="r"><span>${x.n}</span><b>${x.t}</b></div><div class="pista"><i style="width:${x.v / tope * 100}%"></i></div></div>`).join(''); };

function embudoHtml(E) {
  const top = E[0].v;
  let peor = 1, peorP = 0;
  for (let i = 1; i < E.length; i++) { const se = 100 - pct(E[i].v, E[i - 1].v); if (i > 1 && se > peorP) { peorP = se; peor = i; } }
  return `<div class="embudo">${E.map((e, i) => {
    const fuga = i ? `<div class="fuga${i === peor ? ' peor' : ''}">↓ se van ${miles(E[i - 1].v - e.v)} (${pctTxt(Math.round(100 - pct(e.v, E[i - 1].v)))})${i === peor ? ' · aquí se pierde más gente' : ''}</div>` : '';
    return `${fuga}<div class="paso${i === E.length - 1 ? ' final' : ''}"><span class="n">${e.nombre}</span><div class="bar"><i style="width:${Math.max(e.v / top * 100, 1)}%"></i></div><span class="c">${miles(e.v)}<small>${pctTxt(pct(e.v, top))}</small></span></div>`;
  }).join('')}</div>`;
}

function dona(partes) {
  let a = -Math.PI / 2; const R = 46, r = 30, cx = 55, cy = 55;
  const arcos = partes.map(p => {
    const b = a + p.v * Math.PI * 2, g = p.v > 0.5 ? 1 : 0;
    const P = (ang, rad) => `${(cx + rad * Math.cos(ang)).toFixed(2)} ${(cy + rad * Math.sin(ang)).toFixed(2)}`;
    const d = `M${P(a, R)} A${R} ${R} 0 ${g} 1 ${P(b, R)} L${P(b, r)} A${r} ${r} 0 ${g} 0 ${P(a, r)}Z`; a = b;
    return `<path d="${d}" fill="${p.c}"/>`;
  }).join('');
  return `<div class="dona"><svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="Celular y computador">${arcos}
    <text x="55" y="53" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--negro)">${Math.round(partes[0].v * 100)} %</text><text x="55" y="68" text-anchor="middle">celular</text></svg>
    <ul>${partes.map(p => `<li><span><i style="background:${p.c}"></i>${p.n}</span><b>${p.t}</b></li>`).join('')}</ul></div>`;
}

function lineaVelocidad(V) {
  const W = Math.max(300, Math.min(1120, innerWidth - 64)), H = 180, iz = 30, de = 22, ar = 10, ab = 22, max = 6;
  const x = i => iz + (V.length === 1 ? 0 : i * (W - iz - de) / (V.length - 1)), y = s => ar + (1 - s / max) * (H - ar - ab);
  const camino = k => V.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v[k]).toFixed(1)}`).join(' ');
  const cada = Math.ceil(V.length / 8);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:${H}px" role="img" aria-label="Tiempo de carga en celular">
    <rect x="${iz}" y="${y(max)}" width="${W - iz - de}" height="${y(4) - y(max)}" fill="#FBE9E7"/>
    <rect x="${iz}" y="${y(4)}" width="${W - iz - de}" height="${y(2.5) - y(4)}" fill="#FFF7E0"/>
    <rect x="${iz}" y="${y(2.5)}" width="${W - iz - de}" height="${y(0) - y(2.5)}" fill="#EAF6EE"/>
    ${[0, 2, 4, 6].map(s => `<text x="${iz - 6}" y="${y(s) + 3}" text-anchor="end">${s} s</text>`).join('')}
    <path d="${camino('p75')}" fill="none" stroke="var(--rojo)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${camino('p50')}" fill="none" stroke="var(--negro)" stroke-width="2.5"/>
    ${V.map((v, i) => (V.length - 1 - i) % cada ? '' : `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(v.t.split(' ').pop().replace(/:00 a.*/, ''))}</text>`).join('')}
  </svg>
  <div class="leyenda"><span><i style="background:var(--negro)"></i>La mitad de las visitas carga en menos de esto</span><span><i style="background:var(--rojo)"></i>El 25 % más lento</span>
    <span><i style="background:#EAF6EE;border:1px solid #cfe8d8"></i>Bien (&lt; 2,5 s)</span><span><i style="background:#FFF7E0;border:1px solid #f0dfa8"></i>Mejorable</span><span><i style="background:#FBE9E7;border:1px solid #f2c8c2"></i>Lento (&gt; 4 s)</span></div>`;
}

/* ---------- Pestaña Visitas ---------- */
function pintar(p) {
  const D = datos(p);
  const vs = {hoy: 'ayer a esta hora', '7': 'los 7 días anteriores', '30': 'los 30 días anteriores', mes: 'el mes pasado a esta fecha'}[p];
  const conv = pct(D.pedidos, D.visitas);
  const max2 = Math.max(1, ...D.serie.map(x => x.ped));
  const serie = D.serie.map(x => ({...x, v2: x.ped}));
  const porHora = p === 'hoy' ? D.serie : Array.from({length: 24}, (_, h) => {
    const c = [2,1,1,0,0,1,2,4,7,10,13,15,17,16,15,16,18,21,26,31,35,33,22,9][h];
    return {v: Math.round(c / 383 * D.visitas), largo: `${h}:00 a ${h}:59`, corto: String(h)};
  });
  const vel = D.velocidad, ult = vel[vel.length - 1], p50 = (vel.reduce((s, v) => s + v.p50, 0) / vel.length).toFixed(1), p75 = (vel.reduce((s, v) => s + v.p75, 0) / vel.length).toFixed(1);
  const clase = s => s < 2.5 ? ['ok', 'Bien'] : s <= 4 ? ['medio', 'Mejorable'] : ['mal', 'Lento'];
  const mejorOrigen = D.origenes.reduce((m, o) => pct(o.ped, o.v) > pct(m.ped, m.v) ? o : m);

  document.getElementById('pnl').innerHTML = `
    <section class="pz hero">
      <div class="vivo"><span class="punto"></span> Ahora mismo: <b style="color:#fff">7 personas</b> en la página</div>
      <ul class="ahora"><li><span>Colo-Colo (ficha)</span><span>3</span></li><li><span>Pedido · paso de entrega</span><span>2</span></li><li><span>Portada</span><span>2</span></li></ul>
      <div class="trio"><div><b>${miles(D.visitas)}</b><span>visitas</span></div><div><b>${pctTxt(conv)}</b><span>conversión</span></div><div><b>${miles(D.pedidos)}</b><span>pedidos web</span></div></div>
    </section>
    <section class="pz hero">
      <div class="et">Visitas · ${{hoy: 'hoy', '7': 'últimos 7 días', '30': 'últimos 30 días', mes: 'noviembre'}[p]}</div>
      <div class="grande">${miles(D.visitas)}</div>${variacion(D.visitas, D.anterior, vs)}
      <div class="trio"><div><b>${miles(D.personas)}</b><span>personas distintas</span></div><div><b>${pctTxt(Math.round(D.celular * 100))}</b><span>desde celular</span></div><div><b>${miles(D.pagaron)}</b><span>pagaron</span></div></div>
    </section>

    <section class="pz ancho"><div class="kpis">
      <div class="kpi"><div class="et">Personas distintas</div><div class="val">${miles(D.personas)}</div>${variacion(D.personas, Math.round(D.anterior * 0.7), vs)}</div>
      <div class="kpi"><div class="et">Conversión (pedido ÷ visitas)</div><div class="val">${pctTxt(conv)}</div>${variacion(conv, 3.4, vs)}</div>
      <div class="kpi"><div class="et">Pedidos web</div><div class="val">${miles(D.pedidos)}</div>${variacion(D.pedidos, Math.round(D.pedidos * 0.86), vs)}</div>
      <div class="kpi"><div class="et">Tiempo de carga (celular)</div><div class="val">${String(p50).replace('.', ',')} s</div><span class="semaforo ${clase(+p50)[0]}">${clase(+p50)[1]}</span></div>
    </div></section>

    ${pieza(p === 'hoy' ? 'Visitas y pedidos por hora' : 'Visitas y pedidos por día', 'Toca una barra para ver el detalle',
      columnas('serie', serie, d => `${miles(d.v)} visitas · ${d.ped} pedidos (${pctTxt(pct(d.ped, d.v))})`, {segunda: true, max2: max2 * 6}) +
      `<div class="leyenda"><span><i style="background:var(--barra-dato)"></i>Visitas</span><span><i style="background:var(--celeste)"></i>Pedidos</span></div>`, 'ancho')}

    ${pieza('Embudo: de la visita al pago', 'Cuántos llegan a cada paso. En rojo, el paso donde más gente se va. Los dos últimos salen de la bandeja.', embudoHtml(D.embudo), 'ancho')}

    ${pieza('De dónde llegan', `Conversión = pedidos ÷ visitas de ese origen. Hoy convierte mejor: <b>${mejorOrigen.n}</b>.`,
      `<table class="t"><tr><th>Origen</th><th class="n">Visitas</th><th class="n">Pedidos</th><th class="n">Conversión</th></tr>${D.origenes.map(o => `<tr><td>${o.n}<div class="mini"><i style="width:${o.v / D.origenes[0].v * 100}%"></i></div></td><td class="n">${miles(o.v)}</td><td class="n">${o.ped}</td><td class="n ${o === mejorOrigen ? 'mejor' : ''}">${pctTxt(pct(o.ped, o.v))}</td></tr>`).join('')}</table>`, 'ancho')}

    ${pieza('Productos: miran vs compran', 'Café = vieron la ficha · celeste = lo compraron. <span class="ojo">ojo</span> = mucho mirar, poco comprar: revisar precio, foto o ficha.',
      D.productos.map(x => { const ojo = pct(x.ven, x.vis) < 2.5; return `<div class="hb"><div class="r"><span>${x.n}${ojo ? '<span class="ojo">ojo</span>' : ''}</span><b>${miles(x.vis)} · ${x.ven}</b></div><div class="pista dos"><i style="width:${x.vis / D.productos[0].vis * 100}%"></i><i class="b" style="width:${Math.max(x.ven / D.productos[0].vis * 100 * 6, 1)}%"></i></div></div>`; }).join('') +
      `<div class="leyenda"><span><i style="background:var(--barra-dato)"></i>Vieron la ficha</span><span><i style="background:var(--celeste)"></i>Compraron (escala ×6 para que se vea)</span></div>`)}

    ${pieza('Ofertas del pedido', 'De los que la vieron, cuántos la aceptaron',
      barras(D.ofertas.map(o => ({n: o.n, v: pct(o.a, o.v), t: `${o.a} de ${o.v} · ${pctTxt(pct(o.a, o.v))}`}))))}

    ${pieza('¿A qué hora entran?', p === 'hoy' ? 'Visitas de hoy por hora' : 'Visitas por hora, sumando el período', columnas('hora', porHora, d => `${miles(d.v)} visitas`, {bajo: true, marcas: 6}))}

    ${pieza('Celular o computador', 'Cómo ven la página', dona([
      {n: 'Celular', v: D.celular, c: 'var(--barra-dato)', t: miles(Math.round(D.visitas * D.celular))},
      {n: 'Computador', v: 1 - D.celular - 0.02, c: 'var(--celeste)', t: miles(Math.round(D.visitas * (1 - D.celular - 0.02)))},
      {n: 'Tablet', v: 0.02, c: 'var(--lila)', t: miles(Math.round(D.visitas * 0.02))}]))}

    ${pieza('Velocidad de carga en celular', 'Segundos hasta que se ven los productos. La meta es quedar en verde.',
      `<div class="vel-top"><div><b>${String(p50).replace('.', ',')} s</b><span>la mitad carga en menos de esto</span></div><div><b>${String(p75).replace('.', ',')} s</b><span>el 25 % más lento</span></div><div><span class="semaforo ${clase(+p75)[0]}">${clase(+p75)[1]}</span></div></div>` + lineaVelocidad(vel), 'ancho')}

    ${pieza('Buscan y no encuentran', 'Lo que escribieron en el buscador sin resultados: ideas de productos nuevos',
      `<div class="chips">${[['Cobreloa', 14], ['Huachipato', 11], ['Barcelona', 9], ['Pikachu', 7], ['Boca Juniors', 6], ['Messi', 5], ['Unión La Calera', 4], ['llavero', 3]].map(([t, n]) => `<span class="chip">${t}<b>${n}</b></span>`).join('')}</div>`)}

    ${pieza('Salud de la página', 'Cosas que fallaron en el período',
      `<ul class="lista">
        <li><span class="num ${D.errores.cortados > 20 ? 'urge' : ''}">${D.errores.cortados}</span><span><b>Pedidos que se cortaron a la mitad</b><small>Empezaron el pedido y no llegaron a guardarlo</small></span></li>
        <li><span class="num ${D.errores.fotos ? 'urge' : 'ok'}">${D.errores.fotos}</span><span><b>Fotos que no cargaron</b><small>${D.errores.fotos ? 'Ej.: deportes-iquique-clasico.jpg' : 'Todo bien'}</small></span></li>
        <li><span class="num ${D.errores.js ? 'urge' : 'ok'}">${D.errores.js}</span><span><b>Errores de la página</b><small>${D.errores.js ? 'Se avisan al hilo que corresponde' : 'Todo bien'}</small></span></li>
      </ul>`)}

    ${pieza('Pendientes de la página web', 'Desde PENDIENTES.md del repo',
      `<ul class="lista">
        <li><span class="num">W4</span><span><b>Comprar dominio y conectarlo a Cloudflare</b><small>aureocl.cl o tiendaaureo.cl</small></span><span class="estado espera">espera a Áureo</span></li>
        <li><span class="num">W4</span><span><b>Píxel «Aureo web» + verificar dominio + aviso de cookies</b></span><span class="estado">por hacer</span></li>
        <li><span class="num">W2</span><span><b>Cuentas de Javi y Caro en la pantalla de pago</b></span><span class="estado espera">espera a Áureo</span></li>
        <li><span class="num">W2</span><span><b>Oferta única por equipo</b><small>Cada club con su complemento</small></span><span class="estado">por hacer</span></li>
        <li><span class="num">W1</span><span><b>Mejor imagen del pack de camisetas</b></span><span class="estado">por hacer</span></li>
      </ul>`, 'ancho')}
  `;
}

document.getElementById('periodo').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#periodo button').forEach(x => x.classList.toggle('on', x === b));
  for (const k in ELEGIDA) delete ELEGIDA[k];
  pintar(b.dataset.p);
};
document.getElementById('pnl').onclick = e => {
  const b = e.target.closest('[data-graf]'); if (!b) return;
  const id = b.dataset.graf; ELEGIDA[id] = +b.dataset.i;
  document.querySelectorAll(`[data-graf="${id}"]`).forEach(x => x.classList.toggle('sel', x === b));
  document.getElementById('lec-' + id).textContent = b.dataset.texto;
};
pintar('7');
</script>
</body>
</html>
